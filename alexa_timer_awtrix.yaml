blueprint:
  name: Alexa Timer → AWTRIX (v3.0)
  description: >
    Zeigt den nächsten Alexa-Timer als Live-Countdown auf einer oder mehreren
    AWTRIX-Uhren an und löst beim Ablauf einen Alarm aus (Standard `!!!LOS!!!`).

    Unterstützt BEIDE Firmwares gleichzeitig und beliebig viele Geräte:
      • AWTRIX 3  (awtrix-light) – Topics: <prefix>/notify, <prefix>/custom/<app>
      • AWTRIX NG (blueforcer/awtrix-ng) – Topics: <prefix>/cmd/notify,
        <prefix>/cmd/apps/pushed/<app>

    Du trägst die Topic-Prefixe deiner Geräte in die passende Liste ein
    ("AWTRIX 3 Geräte" bzw. "AWTRIX NG Geräte") – damit ist die Firmware pro
    Gerät gewählt. Beide Listen können gleichzeitig gefüllt sein.

    Aufbau: EINE Automation, kein separater Sensor, kein Helfer.
      • Countdown läuft in einer Schleife NUR während eines aktiven Timers ->
        im Leerlauf null Systemlast (kein Sekunden-Trigger).
      • Alarm wird AUSSCHLIESSLICH beim Erreichen der Zielzeit ausgelöst ->
        kein Fehlalarm beim Stellen/Abbrechen.
      • Abbruch auf Alexa -> Anzeige wird auf allen Geräten gelöscht.

    Anzeige-Modus (für alle Geräte):
      • "Im App-Wechsel": Custom/Pushed App, rotiert mit den übrigen Apps.
      • "Nur Timer anpinnen": gehaltene Notification (hold), überdeckt andere Apps.

    Voraussetzungen: MQTT-Integration aktiv; AWTRIX-Uhren per MQTT verbunden;
    Alexa Media Player (HACS) für den *_next_timer-Sensor.

    Changelog:
      v3.0 - Multi-Device + AWTRIX NG: zwei Geräte-Listen (AWTRIX 3 / AWTRIX NG),
             beliebig viele Geräte, firmware-spezifische Topics & Payloads. Die
             bewährte Countdown-/Alarm-Logik (locked_target, mode: single) bleibt.
      v2.0 - Pinned-Fix: Alarm sendet "stack":false und ersetzt den gehaltenen
             Countdown, statt sich dahinter zu stapeln.
      v1.9 - Zielzeit per "variables"-Schritt eingefroren (locked_target).
      v1.6 - Sekunden-Trigger entfernt -> keine Leerlauf-Last.
      v1.0 - Erstausgabe (eine Automation statt 2 Sensoren + 4 Automationen).

  domain: automation
  source_url: https://github.com/x1marc/ha-blueprints/blob/main/alexa_timer_awtrix.yaml

  input:
    # ─── ⏱️ QUELLE ────────────────────────────────────────────────
    source_timer:
      name: Alexa Timer-Sensor
      description: >
        Der "next timer"-Sensor von Alexa Media Player. Bei laufendem Timer ist
        sein STATE die Zielzeit (ISO-Zeitstempel in der Zukunft).
      selector:
        entity:
          filter:
            - domain: sensor

    # ─── 📟 AWTRIX-GERÄTE ─────────────────────────────────────────
    awtrix3_prefixes:
      name: "AWTRIX 3 Geräte (Topic-Prefixe)"
      description: >
        MQTT-Topic-Prefixe deiner AWTRIX-3-Geräte (awtrix-light), z. B. "awtrix".
        Mehrere möglich (eins pro Zeile). Leer lassen, wenn du keine AWTRIX-3-
        Geräte hast.
      default: ["awtrix"]
      selector:
        text:
          multiple: true

    awtrixng_prefixes:
      name: "AWTRIX NG Geräte (Topic-Prefixe)"
      description: >
        MQTT-Topic-Prefixe deiner AWTRIX-NG-Geräte, z. B. "awtrixNG". Steht der
        Prefix leer, nutzt NG die 12-stellige MAC. Mehrere möglich. Leer lassen,
        wenn du keine AWTRIX-NG-Geräte hast.
      default: []
      selector:
        text:
          multiple: true

    app_name:
      name: Name der App
      description: >
        Interner App-Name für den Countdown im Modus "Im App-Wechsel"
        (AWTRIX 3: .../custom/<Name>, AWTRIX NG: .../cmd/apps/pushed/<Name>).
        Nur A-Z, a-z, 0-9, _ und - (max. 32 Zeichen, NG-Vorgabe).
      default: "alexatimer"
      selector:
        text: {}

    # ─── 🖥️ ANZEIGE-MODUS ─────────────────────────────────────────
    display_mode:
      name: Anzeige-Modus
      description: >
        "Im App-Wechsel": Timer rotiert als App mit den übrigen Apps.
        "Nur Timer anpinnen": Timer wird gehalten und überdeckt andere Apps.
      default: app
      selector:
        select:
          options:
            - label: "Im App-Wechsel (rotiert mit anderen Apps)"
              value: app
            - label: "Nur Timer anpinnen (kein App-Wechsel)"
              value: pinned

    # ─── 🎨 COUNTDOWN-ANZEIGE ─────────────────────────────────────
    countdown_color:
      name: Farbe des Countdowns
      description: Farbe für den Countdown-Text (Farbrad).
      default: [172, 7, 242]
      selector:
        color_rgb: {}

    countdown_icon:
      name: Icon (optional)
      description: AWTRIX-Icon-ID für den Countdown (leer = kein Icon).
      default: ""
      selector:
        text: {}

    always_show_hours:
      name: Stunden immer anzeigen
      description: Aus = HH nur bei > 0 (sonst MM:SS). An = immer H:MM:SS.
      default: false
      selector:
        boolean: {}

    # ─── 🔔 ALARM ─────────────────────────────────────────────────
    alarm_text:
      name: Alarm-Text
      description: Text beim Ablauf des Timers.
      default: "!!!LOS!!!"
      selector:
        text: {}

    alarm_color:
      name: Alarm-Farbe
      description: Farbe des Alarm-Textes (Farbrad).
      default: [255, 0, 0]
      selector:
        color_rgb: {}

    alarm_blink:
      name: Alarm-Text blinken
      default: true
      selector:
        boolean: {}

    alarm_duration:
      name: Alarm-Anzeigedauer (Sekunden)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
          mode: slider

    alarm_effect:
      name: Alarm-Effekt
      description: >
        Hintergrundeffekt für den Alarm. "Kein Effekt" = nur Text + Farbe.
        Gilt für beide Firmwares (Effektnamen sind bei AWTRIX 3 und NG gleich).
      default: "PlasmaCloud"
      selector:
        select:
          options:
            - label: "Kein Effekt"
              value: "none"
            - label: "Fade"
              value: "Fade"
            - label: "MovingLine"
              value: "MovingLine"
            - label: "BrickBreaker"
              value: "BrickBreaker"
            - label: "PingPong"
              value: "PingPong"
            - label: "Radar"
              value: "Radar"
            - label: "Checkerboard"
              value: "Checkerboard"
            - label: "Fireworks"
              value: "Fireworks"
            - label: "PlasmaCloud"
              value: "PlasmaCloud"
            - label: "Ripple"
              value: "Ripple"
            - label: "Snake"
              value: "Snake"
            - label: "Pacifica"
              value: "Pacifica"
            - label: "TheaterChase"
              value: "TheaterChase"
            - label: "Plasma"
              value: "Plasma"
            - label: "Matrix"
              value: "Matrix"
            - label: "SwirlIn"
              value: "SwirlIn"
            - label: "SwirlOut"
              value: "SwirlOut"
            - label: "LookingEyes"
              value: "LookingEyes"
            - label: "TwinklingStars"
              value: "TwinklingStars"
            - label: "ColorWaves"
              value: "ColorWaves"

mode: single
max_exceeded: silent

variables:
  source_timer: !input source_timer
  awtrix3_prefixes: !input awtrix3_prefixes
  awtrixng_prefixes: !input awtrixng_prefixes
  app_name: !input app_name
  display_mode: !input display_mode
  countdown_color: !input countdown_color
  countdown_icon: !input countdown_icon
  always_show_hours: !input always_show_hours
  alarm_text: !input alarm_text
  alarm_color: !input alarm_color
  alarm_blink: !input alarm_blink
  alarm_duration: !input alarm_duration
  alarm_effect: !input alarm_effect
  # Zielzeit des Timers als Unix-Zeit (0 = kein verwertbarer Zeitstempel).
  target_epoch: >
    {% set nt = states(source_timer) %}
    {% if nt not in ['unknown', 'unavailable', '', 'Kein Timer gestellt'] %}
      {% set t = as_datetime(nt) %}
      {{ (t.timestamp() | round(0)) if t is not none else 0 }}
    {% else %}
      0
    {% endif %}
  # Läuft ein echter Timer? Zielzeit > 2 s in der Zukunft.
  counting: "{{ (target_epoch | float(0)) > 0 and (target_epoch | float(0)) - now().timestamp() > 2 }}"
  # Kein Zeitstempel im Sensor (unavailable/kein Timer).
  no_timer: "{{ (target_epoch | float(0)) == 0 }}"
  # Statische Alarm-Payloads je Firmware (Farbe als [r,g,b] – beide akzeptieren das).
  alarm_payload_v3: >-
    {"text":"{{ alarm_text }}","color":{{ alarm_color | to_json }},"center":true,"stack":false,"duration":{{ alarm_duration | int }},"wakeup":true{% if alarm_blink %},"blinkText":700{% endif %}{% if alarm_effect not in ['none', '', None] %},"effect":"{{ alarm_effect }}"{% endif %}}
  alarm_payload_ng: >-
    {"text":"{{ alarm_text }}","textColor":{{ alarm_color | to_json }},"textCenter":true,"stack":false,"durationMs":{{ (alarm_duration | int) * 1000 }},"wakeup":true{% if alarm_blink %},"textBlinkMs":700{% endif %}{% if alarm_effect not in ['none', '', None] %},"effect":"{{ alarm_effect }}"{% endif %}}

triggers:
  # Nur bei Zustandsänderung des Alexa-Sensors – kein Sekunden-Trigger.
  - trigger: state
    entity_id: !input source_timer
    id: source
  - trigger: homeassistant
    event: start
    id: hastart

conditions: []

actions:
  - choose:
      # ── Timer läuft: Countdown-Schleife (mode: single, 1×) ──────
      - conditions:
          - condition: template
            value_template: "{{ counting | bool }}"
        sequence:
          # Zielzeit EINMAL einfrieren (Zahl, ändert sich nicht).
          - variables:
              locked_target: "{{ target_epoch | float(0) }}"
          - repeat:
              while:
                - condition: template
                  value_template: "{{ locked_target - now().timestamp() > 0 }}"
                - condition: template
                  value_template: "{{ states(source_timer) not in ['unavailable', 'unknown', '', 'Kein Timer gestellt'] }}"
              sequence:
                # Countdown-Text 1× je Sekunde berechnen ...
                - variables:
                    cd_txt: >
                      {% set s = [locked_target - now().timestamp(), 0] | max | int %}
                      {% set h = s // 3600 %}{% set m = (s % 3600) // 60 %}{% set sec = s % 60 %}
                      {% if always_show_hours or h > 0 %}{{ '%d:%02d:%02d' | format(h, m, sec) }}{% else %}{{ '%02d:%02d' | format(m, sec) }}{% endif %}
                # ... und an alle AWTRIX-3-Geräte senden
                - repeat:
                    for_each: "{{ awtrix3_prefixes }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "{{ repeat.item }}/{{ 'notify' if display_mode == 'pinned' else 'custom/' ~ app_name }}"
                          payload: >-
                            {% if display_mode == 'pinned' %}{"text":"{{ cd_txt }}","color":{{ countdown_color | to_json }},"pushIcon":0,"hold":true,"stack":false,"wakeup":true{% if countdown_icon %},"icon":"{{ countdown_icon }}"{% endif %}}{% else %}{"text":"{{ cd_txt }}","color":{{ countdown_color | to_json }},"pushIcon":0,"duration":5{% if countdown_icon %},"icon":"{{ countdown_icon }}"{% endif %}}{% endif %}
                # ... und an alle AWTRIX-NG-Geräte
                - repeat:
                    for_each: "{{ awtrixng_prefixes }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "{{ repeat.item }}/cmd/{{ 'notify' if display_mode == 'pinned' else 'apps/pushed/' ~ app_name }}"
                          payload: >-
                            {% if display_mode == 'pinned' %}{"text":"{{ cd_txt }}","textColor":{{ countdown_color | to_json }},"iconMode":"fixed","hold":true,"stack":false,"wakeup":true{% if countdown_icon %},"icon":"{{ countdown_icon }}"{% endif %}}{% else %}{"text":"{{ cd_txt }}","textColor":{{ countdown_color | to_json }},"lifetimeMs":5000{% if countdown_icon %},"icon":"{{ countdown_icon }}"{% endif %}}{% endif %}
                - delay: "00:00:01"
          # Schleife beendet:
          - choose:
              # Zielzeit erreicht -> regulärer Ablauf -> Alarm auf allen Geräten
              - conditions:
                  - condition: template
                    value_template: "{{ locked_target - now().timestamp() <= 0 }}"
                sequence:
                  - repeat:
                      for_each: "{{ awtrix3_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}/notify"
                            payload: "{{ alarm_payload_v3 }}"
                  - repeat:
                      for_each: "{{ awtrixng_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}/cmd/notify"
                            payload: "{{ alarm_payload_ng }}"
                  # Im App-Modus die Countdown-App entfernen (LOS ist Notification)
                  - if:
                      - condition: template
                        value_template: "{{ display_mode == 'app' }}"
                    then:
                      - repeat:
                          for_each: "{{ awtrix3_prefixes }}"
                          sequence:
                            - action: mqtt.publish
                              data: { topic: "{{ repeat.item }}/custom/{{ app_name }}", payload: "" }
                      - repeat:
                          for_each: "{{ awtrixng_prefixes }}"
                          sequence:
                            - action: mqtt.publish
                              data: { topic: "{{ repeat.item }}/cmd/apps/pushed/{{ app_name }}", payload: "" }
            # Schleife vorzeitig beendet (Timer abgebrochen) -> Anzeige löschen
            default:
              - if:
                  - condition: template
                    value_template: "{{ display_mode == 'pinned' }}"
                then:
                  - repeat:
                      for_each: "{{ awtrix3_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data: { topic: "{{ repeat.item }}/notify/dismiss", payload: "" }
                  - repeat:
                      for_each: "{{ awtrixng_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data: { topic: "{{ repeat.item }}/cmd/notify/dismiss", payload: "" }
                else:
                  - repeat:
                      for_each: "{{ awtrix3_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data: { topic: "{{ repeat.item }}/custom/{{ app_name }}", payload: "" }
                  - repeat:
                      for_each: "{{ awtrixng_prefixes }}"
                      sequence:
                        - action: mqtt.publish
                          data: { topic: "{{ repeat.item }}/cmd/apps/pushed/{{ app_name }}", payload: "" }

      # ── Sensor zeigt keinen Timer (Abbruch/Dismiss): löschen ────
      - conditions:
          - condition: template
            value_template: "{{ no_timer | bool }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ display_mode == 'pinned' }}"
            then:
              - repeat:
                  for_each: "{{ awtrix3_prefixes }}"
                  sequence:
                    - action: mqtt.publish
                      data: { topic: "{{ repeat.item }}/notify/dismiss", payload: "" }
              - repeat:
                  for_each: "{{ awtrixng_prefixes }}"
                  sequence:
                    - action: mqtt.publish
                      data: { topic: "{{ repeat.item }}/cmd/notify/dismiss", payload: "" }
            else:
              - repeat:
                  for_each: "{{ awtrix3_prefixes }}"
                  sequence:
                    - action: mqtt.publish
                      data: { topic: "{{ repeat.item }}/custom/{{ app_name }}", payload: "" }
              - repeat:
                  for_each: "{{ awtrixng_prefixes }}"
                  sequence:
                    - action: mqtt.publish
                      data: { topic: "{{ repeat.item }}/cmd/apps/pushed/{{ app_name }}", payload: "" }
    default: []
