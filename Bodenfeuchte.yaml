blueprint:
  name: "🌱 Bodenfeuchte Alarm System"
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  description: |
    # 🌱 Bodenfeuchte Alarm System

    **Autor:** x1marc &emsp; **Version:** 2.8 &emsp; **Letzte Änderung:** 2026-08-16

    ---

    ## Was macht dieser Blueprint?

    Überwacht einen Bodenfeuchte-Sensor und benachrichtigt zuverlässig, sobald die
    Pflanze Wasser braucht – und wieder, wenn sie versorgt ist. Optional gießt er
    automatisch. Alles über Einstellungen konfigurierbar, kein Code nötig.

    ---

    ## 📋 Funktionsübersicht

    <details>
    <summary><b>🌵 Trocken-Alarm</b> – Wann wird gewarnt?</summary>

    Alarm, sobald der Sensorwert für eine einstellbare Zeit **unter dem Grenzwert** liegt.

    - **Grenzwert** frei einstellbar (Standard: 50 %)
    - **Hysterese** verhindert Fehlalarme bei schwankendem Sensor
    - **Verzögerung** vor Auslösung – kein Alarm bei kurzen Ausreißern
    - **Einmalig oder wiederholt** – Wiederholung gilt nur für Alexa
    - **Sperrzeit** verhindert Mehrfachwarnungen in kurzer Zeit
    - **Nach HA-Neustart** wird geprüft, ob die Pflanze bereits trocken ist

    </details>

    <details>
    <summary><b>🌿 OK-Rückmeldung</b> – Entwarnung automatisch senden</summary>

    Sobald die Feuchte stabil über dem OK-Wert (Grenzwert + Hysterese) liegt, kann
    optional eine „Alles gut"-Meldung gesendet werden. Global und pro Kanal schaltbar.

    </details>

    <details>
    <summary><b>🔔 Benachrichtigungskanäle</b></summary>

    | Kanal | Trocken | OK |
    |---|---|---|
    | 📱 Mobile App (mehrere Geräte) | ✓ | ✓ |
    | 📋 Anhaltende HA-Benachrichtigung | ✓ | ✓ |
    | 🔊 Alexa-Durchsage | ✓ | ✓ |

    **Alexa:** mehrere Lautsprecher, Lautstärke temporär setzbar und danach wiederherstellbar.

    </details>

    <details>
    <summary><b>📍 Anwesenheitserkennung</b> – Alexa nur bei Anwesenheit</summary>

    Alexa spricht nur, wenn mindestens eine gewählte Person / ein Gerätetracker in
    mindestens einer gewählten Zone ist. Unterstützt `person.*` und `device_tracker.*`.
    Verglichen wird sowohl gegen den Zonen-Namen als auch gegen die Zonen-ID –
    dadurch funktionieren auch andere Zonen als `zone.home`.

    </details>

    <details>
    <summary><b>🌙 Ruhezeit</b> – Keine Störungen zur Unzeit</summary>

    Pro Kanal eine eigene Ruhezeit, korrekt über Mitternacht hinweg.
    **Nachholung:** Fällt ein Alarm in die Ruhezeit, wird er zum Ruhezeit-Ende
    nachgeholt – sofern die Pflanze dann noch trocken ist. Das läuft über eigene
    Zeit-Trigger und übersteht daher auch einen HA-Neustart.

    </details>

    <details>
    <summary><b>🏖️ Urlaubs-/Pause-Modus</b></summary>

    Ein `input_boolean` schaltet alle Benachrichtigungen stumm – Trocken-Alarm **und**
    Entwarnung. Automatisches und planmäßiges Gießen laufen weiter, die Pflanze wird
    also auch im Urlaub versorgt.

    </details>

    <details>
    <summary><b>🚨 Sensorausfall-Erkennung</b></summary>

    Separate Warnung, wenn der Sensor länger als die eingestellte Toleranzzeit
    `unavailable` oder `unknown` ist.

    </details>

    <details>
    <summary><b>🪣 Bewässerung</b> – automatisch & planmäßig</summary>

    - Pumpe/Ventil beim Trocken-Alarm mit eigener Laufzeit
    - Bewässerungs-Kontrolle: prüft, ob der Sensor danach gestiegen ist
      (bei Misserfolg: 2. Durchgang oder sofortiger Fehler-Alarm)
    - Täglich planmäßiges Gießen zur Wunschzeit, optional mit eigenem Schwellenwert
    - **Not-Abschaltung:** Ein eigener Trigger schaltet die Pumpe nach dem
      Sicherheits-Timeout ab – unabhängig davon, was die Automation gerade macht.

    </details>

    <details>
    <summary><b>📅 Wochentag-Filter</b></summary>

    Begrenzt die Benachrichtigungen auf ausgewählte Wochentage. Das Gießen läuft an
    allen Tagen weiter.

    </details>

    ---

    ## 📓 Changelog

    <details>
    <summary><b>v2.8</b> – 2026-08-16 – Grosses Debugging-Release</summary>

    **Behoben (kritisch):**
    - Bug: Der OK-Trigger nutzte `above: "{{ thr_ok }}"`. Der `numeric_state`-Trigger
      akzeptiert dort kein Template – die **komplette Automation wurde von HA
      abgelehnt und lief gar nicht**. Ersetzt durch einen Template-Trigger.
    - Bug: `variables:` werden von HA nur **einmal** beim Auslösen berechnet. Dadurch
      war die Prüfung `not (in_quiet_*)` nach dem Ruhezeit-Warteblock immer falsch –
      **jeder Alarm während der Ruhezeit ging auf allen drei Kanälen verloren.**
      Ruhezeit-Nachholung läuft jetzt über eigene Zeit-Trigger.
    - Bug: `can_send_alexa_now` wurde als `wait_for_trigger`-Template benutzt. Ein
      Template ohne Entity-Bezug feuert nie → die Alexa-Wiederholung lief 12 h ins
      Timeout und sagte nichts an. Alle Live-Werte werden jetzt pro Schleifendurchlauf
      neu berechnet.
    - Bug: `mode: restart` + 6 Trigger konnte die Pumpe zwischen Ein- und Ausschalten
      abbrechen → **Pumpe blieb an**. Jetzt `mode: parallel` plus eigener
      Not-Abschalt-Trigger auf dem Pumpen-Switch.
    - Bug: `auto_water_safety_timeout` war nirgends im Ablauf verwendet – der
      Sicherheits-Timeout tat nichts. Er steuert jetzt die Not-Abschaltung.
    - Bug: `sensor_failure_hours` stand nicht in `trigger_variables` und war im Trigger
      undefiniert → die Toleranzzeit war **immer 2 h**, der Schieberegler wirkungslos.

    **Behoben (weitere):**
    - `switch.turn_on/off` scheiterte, wenn ein `input_boolean` als Pumpe gewählt war →
      jetzt `homeassistant.turn_on/off`.
    - Sperrzeit und Wochentag-Filter blockierten auch das automatische Gießen,
      obwohl die Beschreibung das Gegenteil sagt. Beide gelten jetzt nur noch für
      Benachrichtigungen.
    - Die Entwarnung prüfte den Pause-Modus nicht – im Urlaub kamen weiterhin
      „Alles gut"-Meldungen.
    - `source_url` zeigte auf ein nicht existierendes Repository (404) – „Blueprint
      neu laden" und Update-Prüfung schlugen fehl.
    - Anwesenheitserkennung verglich nur die Zonen-ID. Personen melden aber den
      Zonen-**Namen** → andere Zonen als `zone.home` trafen nie zu.
    - Planmäßiges Gießen stoppte beim Alarm-OK-Wert statt beim Zeitplan-Schwellenwert –
      präventives Gießen erreichte sein Ziel nie.
    - Nachrichten zeigten den beim Auslösen eingefrorenen Messwert; jetzt wird der
      Sensor beim Senden frisch gelesen.
    - Sinnloser 24-h-Warteblock am Ende des Einmal-Modus entfernt.
    - Ruhezeit-Endzeiten in den Standardwerten sind jetzt quotiert (YAML 1.1 hätte
      z. B. `20:00:00` als Zahl 72000 gelesen).

    **Neu:**
    - Trigger bei HA-Start: ist die Pflanze beim Hochfahren bereits trocken, wird
      alarmiert (`numeric_state` feuert nur beim Unterschreiten).
    - Optionaler Sperrzeit-Speicher (`input_datetime`): macht die Sperrzeit exakt,
      statt sich auf die letzte Ausführung der Automation zu verlassen.
    - Die Alexa-Wiederholschleife wacht bei Ruhezeit-Ende und bei Druck auf einen
      Benachrichtigungs-Button auf.

    </details>

    <details>
    <summary><b>v2.7</b> – 2026-05-21 – Ruhezeit-Puffer abgesichert</summary>

    - Timeout des Ruhezeit-Puffers auf 24 h erhöht, `continue_on_timeout: true`
    - Zusätzliche `not (in_quiet_*)`-Bedingung nach dem Warten
      *(diese Änderung war der Auslöser des in v2.8 behobenen Totalausfalls)*

    </details>

    <details>
    <summary><b>v2.6</b> – 2026-05-21 – Bugfixes</summary>

    - OK-Trigger auf `thr_ok` statt `threshold_low` umgestellt
    - `auto_water_safety_timeout` aus dem Ablauf entfernt
    - Planmäßiges Gießen läuft auch im Pause-Modus

    </details>

    <details>
    <summary><b>v2.5</b> – 2025-05-19 – Felder neu geordnet & Beschreibungen</summary>

    - Alle Eingabefelder logisch gruppiert, Beschreibungen ergänzt und präzisiert

    </details>

    <details>
    <summary><b>v2.4</b> – 2025-05-19 – Logik-Fixes</summary>

    - Planmäßiges Gießen nutzt `wait_for_trigger` statt `delay`
    - Ungenutzte Variablen `zone_slug` und `can_send_dry_now` entfernt

    </details>

    <details>
    <summary><b>v2.3</b> – 2025-05-19 – Planmäßiges Gießen</summary>

    - Tägliche Bewässerung zur eingestellten Uhrzeit, optionaler Sensor-Check,
      eigene Laufzeit und eigener Schwellenwert, Alexa-Bestätigung

    </details>

    <details>
    <summary><b>v2.2</b> – 2025-05-19 – Bewässerungs-Kontrolle</summary>

    - Prüfung nach dem Gießen, „Erneut gießen" oder „Sofort Alarm senden",
      Fehler-Alarm über alle Kanäle

    </details>

    <details>
    <summary><b>v2.1</b> – 2025-05-19 – Snooze-Button</summary>

    - „Später erinnern" in der Push-Benachrichtigung, Dauer 5–480 Minuten

    </details>

    <details>
    <summary><b>v2.0</b> – 2025-05-19 – Pause-Modus nur für Benachrichtigungen</summary>

    - Automatisches Gießen läuft im Pause-Modus weiter

    </details>

    <details>
    <summary><b>v1.0 – v1.9.2</b> – 2025-05-19 – Grundfunktionen</summary>

    - Erstimplementierung: Trocken-Alarm, Entwarnung, drei Kanäle, Ruhezeiten,
      Anwesenheitserkennung, Urlaubs-Modus, Sensorausfall-Erkennung, Wochentag-Filter,
      Aktions-Buttons, automatisches Gießen
    - Zahlreiche Fixes an optionalen Feldern (`default: null`), Null-Guards,
      Multi-Personen-/Multi-Zonen-Anwesenheit, `tag`-Ebene in Mobile-Benachrichtigungen

    </details>

  input:

    # ─── 🌱 PFLANZE & SENSOR

    plant_name:
      name: "🌱 Pflanzenname"
      description: >
        Frei wählbarer Name deiner Pflanze (z. B. „Monstera", „Küchenkräuter", „Balkonkasten").
        Dieser Name wird in allen Benachrichtigungen und Ansagen verwendet.
      default: "Monstera"
      selector:
        text:
          multiline: false
          multiple: false

    moisture_sensor:
      name: "💧 Bodenfeuchte-Sensor"
      description: Wähle den Sensor aus, der die Bodenfeuchte deiner Pflanze misst (in Prozent).
      selector:
        entity:
          domain:
          - sensor
          - input_number
          multiple: false
          reorder: false

    threshold_low:
      name: "🔴 Trocken-Grenzwert (%)"
      description: >-
        Fällt die Feuchte dauerhaft unter diesen Wert, wird ein Alarm ausgelöst.
        Empfehlung je nach Pflanze: 30–60 %.
        Tipp: Den Zeitplan-Schwellenwert höher setzen für präventives Gießen bevor der Alarm greift.
      default: 50
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 1.0
          mode: slider
          unit_of_measurement: '%'

    hysteresis:
      name: "🔼 Hysterese – Puffer gegen Fehlalarme (%)"
      description: >
        Schutzpuffer oberhalb des Grenzwerts. „Wieder OK" gilt erst ab: Grenzwert + Hysterese.
        Beispiel: Grenzwert 40 %, Hysterese 5 % → OK-Meldung erst ab 45 %.
        Verhindert, dass der Sensor bei kleinen Schwankungen ständig zwischen Alarm und OK wechselt.
      default: 3
      selector:
        number:
          min: 0.0
          max: 20.0
          step: 1.0
          unit_of_measurement: '%'
          mode: slider

    below_for:
      name: "⏱️ Mindestdauer Trocken-Zustand"
      description: Wie lange muss die Feuchte unter dem Grenzwert liegen, bevor der Alarm ausgelöst wird? Verhindert Fehlalarme durch kurze Ausreißer.
      default:
        minutes: 5
      selector:
        duration: {}

    ok_for:
      name: "⏱️ Mindestdauer Feucht-Zustand (für OK-Meldung)"
      description: Wie lange muss die Feuchte stabil über dem OK-Wert liegen, bevor eine Entwarnung gesendet wird?
      default:
        minutes: 2
      selector:
        duration: {}

    # ─── 🪣 BEWÄSSERUNG – AUTOMATISCH (bei Alarm)

    auto_water_enabled:
      name: "🚪 Automatisches Gießen aktivieren?"
      description: >
        Wenn aktiviert, wird beim Trocken-Alarm automatisch eine Pumpe oder ein
        Ventil eingeschaltet. Die Pumpe läuft für die eingestellte Dauer und schaltet
        danach automatisch ab.
        Optional: Bewässerungs-Kontrolle prüft ob der Sensor danach gestiegen ist.
        Wichtig: Läuft auch wenn der Urlaubs-/Pause-Modus aktiv ist – die Pflanze
        wird immer versorgt, auch ohne Benachrichtigungen.
        Nur relevant wenn ein Switch ausgewählt ist.
      default: false
      selector:
        boolean: {}

    auto_water_switch:
      name: "🚪 Pumpe / Ventil (Switch)"
      description: >
        Wähle den Switch aus, der die Bewässerungspumpe oder das Magnetventil steuert.
        Wird beim Trocken-Alarm eingeschaltet und nach der Laufzeit automatisch abgeschaltet.
        Leer lassen wenn kein automatisches Gießen verwendet wird.
      default: null
      selector:
        entity:
          domain:
          - switch
          - input_boolean
          multiple: false

    auto_water_duration:
      name: "⏱️ Pumpen-Laufzeit (Sekunden)"
      description: >
        Wie lange soll die Pumpe / das Ventil laufen?
        Die Pumpe wird spätestens nach dieser Zeit abgeschaltet.
        Tipp: Starte mit 15–30 Sekunden und passe an bis der Sensorwert merklich steigt.
      default: 30
      selector:
        number:
          min: 5.0
          max: 300.0
          step: 5.0
          unit_of_measurement: s
          mode: slider

    auto_water_safety_timeout:
      name: "🛑 Sicherheits-Timeout (Sekunden)"
      description: >
        Not-Abschaltung: Läuft die Pumpe länger als diese Zeit am Stück, wird sie
        über einen eigenen Trigger zwangsweise abgeschaltet – unabhängig davon, was
        die Automation gerade tut. Das greift auch, wenn der Ablauf abgebrochen wurde
        oder die Pumpe von Hand eingeschaltet wurde.
        Empfehlung: 2–3× die normale Laufzeit.
        Hinweis: Liegt der Wert unter den eingestellten Pumpen-Laufzeiten, wird
        intern automatisch die längere Laufzeit + 30 s verwendet, damit die
        Not-Abschaltung das normale Gießen nicht unterbricht.
      default: 90
      selector:
        number:
          min: 10.0
          max: 600.0
          step: 10.0
          unit_of_measurement: s
          mode: slider

    auto_water_check_enabled:
      name: "🔁 Bewässerungs-Kontrolle aktiv?"
      description: >
        Wenn aktiviert, prüft die Automation nach dem Gießen ob der Sensor gestiegen ist.
        Wenn nicht (Tank leer, Pumpe defekt) → je nach Einstellung erneut gießen oder
        sofort Alarm senden: „Gießen hat nicht geklappt, bitte manuell prüfen."
        Nur relevant wenn automatisches Gießen aktiviert ist.
      default: false
      selector:
        boolean: {}

    auto_water_check_delay:
      name: "⏱️ Wartezeit nach dem Gießen (Sekunden)"
      description: >
        Wie lange nach dem Abschalten der Pumpe soll gewartet werden bevor der
        Sensor abgelesen wird? Gibt dem Wasser Zeit in die Erde einzusickern.
        Wichtig: Zu kurze Wartezeit → Sensor noch nicht gestiegen → fälschlicher Fehler-Alarm.
        Empfehlung: 60–120 Sekunden.
      default: 60
      selector:
        number:
          min: 10.0
          max: 300.0
          step: 10.0
          unit_of_measurement: s
          mode: slider

    auto_water_on_failure:
      name: "🔁 Was tun wenn Gießen nicht funktioniert hat?"
      description: >
        Wähle was passieren soll wenn der Sensor nach dem Gießen nicht gestiegen ist.
        „Erneut gießen": Pumpe läuft ein zweites Mal mit gleicher Laufzeit, dann nochmal warten.
        Danach Fehler-Alarm wenn immer noch trocken. Gut für: Pumpe kurz blockiert.
        „Alarm senden": Sofort Fehler-Alarm senden. Gut für: Tank-Leer-Erkennung.
      default: alarm
      selector:
        select:
          options:
          - label: "🔁 Erneut gießen (dann Alarm wenn immer noch trocken)"
            value: retry
          - label: "🚨 Sofort Alarm senden"
            value: alarm
          multiple: false
          sort: false
          custom_value: false

    auto_water_failure_title:
      name: "🚨 Alarm-Titel bei Gieß-Fehler"
      description: Dieser Titel erscheint in der Benachrichtigung wenn das Gießen nicht funktioniert hat.
      default: "🚨 Gießen fehlgeschlagen!"
      selector:
        text:
          multiline: false
          multiple: false

    auto_water_failure_message:
      name: "🚨 Alarm-Text bei Gieß-Fehler"
      description: >
        Diese Nachricht wird gesendet wenn der Sensor nach dem Gießen nicht gestiegen ist.
        Mögliche Ursachen: Tank leer, Pumpe defekt, Leitung verstopft.
      default: "Gießen hat nicht geklappt – bitte manuell prüfen!"
      selector:
        text:
          multiline: false
          multiple: false

    # ─── ⏰ BEWÄSSERUNG – ZEITPLAN (täglich)

    scheduled_water_enabled:
      name: "⏰ Planmäßiges Gießen aktivieren?"
      description: >
        Wenn aktiviert, läuft die Pumpe täglich zur eingestellten Uhrzeit – unabhängig vom Sensor.
        Optional: Sensor-Check stellt sicher dass nur gegossen wird wenn die Erde wirklich trocken ist.
        Nutzt dieselbe Pumpe wie das automatische Gießen (Pumpe / Ventil Switch).
        Pause-Modus: unterdrückt Alexa-Bestätigung, Pumpe läuft aber trotzdem – Pflanze wird auch im Urlaub versorgt.
      default: false
      selector:
        boolean: {}

    scheduled_water_time:
      name: "⏰ Uhrzeit für planmäßiges Gießen"
      description: >-
        Jeden Tag um diese Uhrzeit wird geprüft ob gegossen werden soll.
        Wenn Sensor-Check aktiv: Pumpe läuft nur wenn Feuchte unter dem Schwellenwert liegt.
        Wenn Sensor-Check deaktiviert: Pumpe läuft immer zur eingestellten Zeit.
      default: "07:00:00"
      selector:
        time: {}

    scheduled_water_duration:
      name: "⏱️ Pump-Laufzeit beim Zeitplan (Sekunden)"
      description: >
        Wie lange soll die Pumpe beim planmäßigen Gießen laufen?
        Kann sich vom automatischen Gießen unterscheiden –
        z. B. kürzere Erhaltungs-Bewässerung morgens.
      default: 20
      selector:
        number:
          min: 5.0
          max: 300.0
          step: 5.0
          unit_of_measurement: s
          mode: slider

    scheduled_water_use_sensor:
      name: "💧 Sensor-Check vor planmäßigem Gießen?"
      description: >
        Wenn aktiviert, wird vor dem Gießen der Sensor geprüft.
        Nur wenn die Feuchte unter dem eingestellten Schwellenwert liegt, läuft die Pumpe.
        Die Pumpe stoppt außerdem vorzeitig, sobald dieser Schwellenwert erreicht ist.
        Deaktiviert: Pumpe läuft immer zur eingestellten Zeit die volle Laufzeit.
      default: true
      selector:
        boolean: {}

    scheduled_water_threshold:
      name: "💧 Schwellenwert für planmäßiges Gießen (%)"
      description: >
        Nur wenn die Bodenfeuchte unter diesem Wert liegt, wird planmäßig gegossen.
        Kann höher sein als der Alarm-Grenzwert für eine präventive Bewässerung:
        z. B. Alarm-Grenzwert 30%, Zeitplan-Schwellenwert 60% – dann wird täglich
        vorsorglich gegossen bevor der Alarm ausgelöst wird.
      default: 60
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 1.0
          unit_of_measurement: '%'
          mode: slider
    # ─── 🔔 ALARM-VERHALTEN

    cooldown_minutes:
      name: "🛑 Sperrzeit nach Alarm (Minuten)"
      description: >
        Nach einem ausgelösten Alarm wird für diese Dauer keine neue Benachrichtigung gesendet.
        Schutz gegen Mehrfachauslösung, z. B. wenn der Sensor kurz über den Grenzwert steigt und wieder fällt.
        Das automatische Gießen ist davon nicht betroffen.
        Auf 0 setzen, um die Sperrzeit zu deaktivieren.
      default: 30
      selector:
        number:
          min: 0.0
          max: 360.0
          step: 1.0
          unit_of_measurement: min
          mode: slider

    cooldown_helper:
      name: "🛑 Sperrzeit-Speicher (optional)"
      description: >
        Optional, aber empfohlen: ein input_datetime-Helfer **mit Datum UND Uhrzeit**.
        Darin wird der Zeitpunkt des letzten Trocken-Alarms gespeichert, wodurch die
        Sperrzeit exakt wirkt.
        Leer lassen → Rückfall auf die letzte Ausführung der Automation. Das ist
        ungenauer, weil dort auch planmäßiges Gießen, Entwarnungen und Button-Klicks
        mitzählen.
      default: null
      selector:
        entity:
          domain:
          - input_datetime
          multiple: false

    repeat_mode:
      name: "🔄 Alarm-Wiederholung"
      description: Gilt nur für Alexa-Durchsagen. Mobile App und HA-Benachrichtigung werden immer einmalig gesendet. Alexa kann zusätzlich wiederholt werden, bis die Pflanze gegossen wurde.
      default: repeat
      selector:
        select:
          options:
          - label: Nur einmal senden
            value: once
          - label: Regelmäßig wiederholen (bis Feuchte OK)
            value: repeat
          multiple: false
          sort: false
          custom_value: false

    repeat_interval:
      name: "⏰ Wiederholungsabstand (Minuten)"
      description: Alle wie viele Minuten soll der Alarm wiederholt werden? Gilt nur wenn „Regelmäßig wiederholen" gewählt ist.
      default: 30
      selector:
        number:
          min: 1.0
          max: 300.0
          step: 1.0
          unit_of_measurement: min
          mode: slider

    snooze_duration:
      name: "😴 Snooze-Dauer (Minuten)"
      description: >
        Wie lange soll die Erinnerung verzögert werden wenn der Nutzer „Später erinnern"
        drückt? Nach Ablauf der Zeit wird erneut eine Push-Benachrichtigung gesendet –
        sofern die Pflanze noch trocken ist.
        Die Alexa-Wiederholschleife pausiert ebenfalls für diese Dauer, wenn einer der
        beiden Buttons gedrückt wurde.
      default: 120
      selector:
        number:
          min: 5.0
          max: 480.0
          step: 5.0
          unit_of_measurement: min
          mode: slider

    weekday_filter_enabled:
      name: "📅 Wochentag-Filter aktivieren?"
      description: Wenn aktiviert, werden Alarm-Benachrichtigungen nur an den gewählten Wochentagen gesendet. Das automatische und planmäßige Gießen läuft an allen Tagen.
      default: false
      selector:
        boolean: {}

    weekday_filter:
      name: "📅 Alarme nur an diesen Wochentagen"
      description: >
        Wähle die Tage, an denen Alarme gesendet werden dürfen.
        Nur relevant wenn „Wochentag-Filter aktivieren" eingeschaltet ist.
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      selector:
        select:
          options:
          - label: Montag
            value: mon
          - label: Dienstag
            value: tue
          - label: Mittwoch
            value: wed
          - label: Donnerstag
            value: thu
          - label: Freitag
            value: fri
          - label: Samstag
            value: sat
          - label: Sonntag
            value: sun
          multiple: true
          sort: false
          custom_value: false

    # ─── 💬 NACHRICHTEN-TEXTE

    title_dry:
      name: "📬 Benachrichtigungstitel – Trocken-Alarm"
      description: Dieser Titel erscheint in der Mobile-App-Benachrichtigung und im HA-Benachrichtigungsbereich.
      default: "🌱 Bodenfeuchte Warnung"
      selector:
        text:
          multiline: false
          multiple: false

    message_prefix_dry:
      name: "📝 Nachrichtentext – Trocken-Alarm"
      description: >
        Dieser Text erscheint im Nachrichteninhalt (Mobile App & HA-Benachrichtigung).
        Pflanzenname, aktueller Sensorwert und Grenzwert werden automatisch angehängt.
      default: "braucht Wasser!"
      selector:
        text:
          multiline: false
          multiple: false

    ok_info_enabled:
      name: "✅ Entwarnung senden (Master-Schalter)"
      description: >-
        Wenn aktiviert, wird nach dem Gießen automatisch eine Entwarnung gesendet, sobald die Feuchte
        stabil über dem OK-Wert liegt (Grenzwert + Hysterese).
        Gilt für alle Kanäle – Alexa kann separat über die Alexa-Einstellungen deaktiviert werden.
      default: true
      selector:
        boolean: {}

    title_ok:
      name: "📬 Benachrichtigungstitel – Entwarnung"
      description: Dieser Titel erscheint in der Entwarnung (Mobile App & HA-Benachrichtigung).
      default: "🌿 Bodenfeuchte wieder OK"
      selector:
        text:
          multiline: false
          multiple: false

    message_prefix_ok:
      name: "📝 Nachrichtentext – Entwarnung"
      description: Dieser Text erscheint im Inhalt der Entwarnung. Pflanzenname, Sensorwert und OK-Grenzwert werden automatisch angehängt.
      default: "ist wieder gut versorgt."
      selector:
        text:
          multiline: false
          multiple: false

    # ─── 🔊 ALEXA

    alexa_enabled_dry:
      name: "🔊 Alexa – Trocken-Alarm aktiv"
      description: Soll Alexa einen Alarm ansagen, wenn die Pflanze zu trocken ist?
      default: true
      selector:
        boolean: {}

    alexa_enabled_ok:
      name: "🔊 Alexa – Entwarnung aktiv"
      description: Soll Alexa eine Entwarnung ansagen, wenn die Feuchte wieder OK ist?
      default: true
      selector:
        boolean: {}

    alexa_targets:
      name: "🔊 Alexa-Geräte (Lautsprecher)"
      description: Wähle einen oder mehrere Echo-Lautsprecher für die Ansagen aus. Leer lassen wenn kein Alexa vorhanden.
      default: []
      selector:
        entity:
          domain:
          - media_player
          multiple: true
          reorder: false

    presence_entity:
      name: "📍 Personen / Geräte für Anwesenheitserkennung"
      description: >
        Alexa spricht nur, wenn mindestens eine dieser Personen (oder Geräte) in
        einer der gewählten Zonen ist. Mehrfachauswahl möglich.
        Leer lassen → Alexa spricht immer (kein Anwesenheitscheck).
      default: []
      selector:
        entity:
          domain:
          - person
          - device_tracker
          multiple: true
          reorder: false

    presence_zone:
      name: "🏠 Zonen für Anwesenheitserkennung"
      description: >
        Alexa spricht, wenn mindestens eine der gewählten Personen in mindestens
        einer dieser Zonen ist. Mehrfachauswahl möglich.
        Leer lassen wenn kein Anwesenheitscheck gewünscht (Alexa spricht immer).
      default: [zone.home]
      selector:
        entity:
          domain:
          - zone
          multiple: true
          reorder: false

    alexa_intro:
      name: "🔊 Alexa-Einleitung (vor dem Ansagetext)"
      description: >
        Optionaler Einleitungstext der vor dem eigentlichen Ansagetext gesprochen wird.
        Beispiele: „Hallo!", „Achtung!", „Hinweis:" – oder leer lassen für keine Einleitung.
      default: "Hinweis:"
      selector:
        text:
          multiline: false
          multiple: false

    alexa_message_dry:
      name: "🔊 Alexa-Ansagetext – Trocken-Alarm"
      description: >-
        Dieser Text wird von Alexa nach der Einleitung gesprochen.
        Beispiel: „Hinweis: Monstera braucht Wasser. Aktuell 24 Prozent."
        Pflanzenname und aktueller Sensorwert werden automatisch ergänzt.
      default: "braucht Wasser."
      selector:
        text:
          multiline: false
          multiple: false

    alexa_message_ok:
      name: "🔊 Alexa-Ansagetext – Entwarnung"
      description: Dieser Text wird von Alexa nach der Einleitung vorgelesen, wenn die Feuchte wieder im grünen Bereich ist.
      default: "Die Bodenfeuchte ist wieder okay."
      selector:
        text:
          multiline: false
          multiple: false

    alexa_volume_temp_enabled:
      name: "🔊 Alexa-Lautstärke vor Ansage anpassen"
      description: Wenn aktiviert, wird die Lautstärke vor der Ansage auf den eingestellten Wert gesetzt und danach automatisch wiederhergestellt.
      default: false
      selector:
        boolean: {}

    alexa_volume_level:
      name: "🔊 Lautstärke für Ansagen (0.0 – 1.0)"
      description: "Gewünschte Lautstärke während der Ansage. 0.0 = stumm, 0.5 = 50 %, 1.0 = maximale Lautstärke."
      default: 0.50
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1
          mode: slider

    alexa_volume_restore_delay:
      name: "⏱️ Wartezeit vor Lautstärke-Wiederherstellung (Sekunden)"
      description: Kurze Pause nach der Ansage, bevor die ursprüngliche Lautstärke wiederhergestellt wird. Erhöhen, wenn die Ansage abgeschnitten wird.
      default: 10
      selector:
        number:
          min: 0.0
          max: 30.0
          step: 1.0
          mode: slider
          unit_of_measurement: s

    alexa_quiet_enabled:
      name: "🌙 Alexa – Ruhezeit aktiv"
      description: >
        Wenn aktiviert, sendet Alexa in der eingestellten Ruhezeit keine Ansagen.
        Ein Alarm, der in die Ruhezeit fällt, wird zum Ruhezeit-Ende nachgeholt,
        sofern die Pflanze dann noch trocken ist.
      default: true
      selector:
        boolean: {}

    alexa_quiet_start:
      name: "🌙 Alexa – Ruhezeit Beginn"
      description: Ab dieser Uhrzeit schweigt Alexa (auch wenn ein Alarm ausgelöst wird).
      default: "20:00:00"
      selector:
        time: {}

    alexa_quiet_end:
      name: "🌙 Alexa – Ruhezeit Ende"
      description: Ab dieser Uhrzeit ist Alexa wieder aktiv. Wird die Endzeit vor der Startzeit gewählt, gilt die Ruhezeit über Mitternacht hinweg.
      default: "08:00:00"
      selector:
        time: {}

    # ─── 📱 MOBILE APP

    mobile_enabled_dry:
      name: "📱 App-Benachrichtigung – Trocken-Alarm aktiv"
      description: Sendet eine Push-Benachrichtigung auf dein Smartphone, wenn die Pflanze Wasser braucht.
      default: true
      selector:
        boolean: {}

    mobile_enabled_ok:
      name: "📱 App-Benachrichtigung – Entwarnung aktiv"
      description: Sendet eine Push-Benachrichtigung auf dein Smartphone, wenn die Feuchte wieder OK ist.
      default: true
      selector:
        boolean: {}

    mobile_device:
      name: "📱 Smartphones für App-Benachrichtigungen"
      description: Wähle ein oder mehrere Smartphones aus. Die Geräte müssen die Home Assistant App installiert haben. Leer lassen wenn keine App-Benachrichtigungen gewünscht.
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

    mobile_quiet_enabled:
      name: "🌙 App-Benachrichtigung – Ruhezeit aktiv"
      description: >
        Wenn aktiviert, werden in der eingestellten Ruhezeit keine Push-Benachrichtigungen gesendet.
        Ein Alarm, der in die Ruhezeit fällt, wird zum Ruhezeit-Ende nachgeholt,
        sofern die Pflanze dann noch trocken ist.
      default: true
      selector:
        boolean: {}

    mobile_quiet_start:
      name: "🌙 App-Benachrichtigung – Ruhezeit Beginn"
      description: Ab dieser Uhrzeit werden keine Push-Benachrichtigungen gesendet. Wird die Endzeit vor der Startzeit gewählt, gilt die Ruhezeit über Mitternacht.
      default: "22:00:00"
      selector:
        time: {}

    mobile_quiet_end:
      name: "🌙 App-Benachrichtigung – Ruhezeit Ende"
      description: Wird die Endzeit vor der Startzeit gewählt, gilt die Ruhezeit über Mitternacht hinweg. Zu dieser Uhrzeit werden zurückgehaltene Alarme nachgeholt.
      default: "07:00:00"
      selector:
        time: {}

    # ─── 📋 HA-BENACHRICHTIGUNG

    persistent_enabled_dry:
      name: "📋 HA-Benachrichtigung – Trocken-Alarm aktiv"
      description: Zeigt eine dauerhafte Benachrichtigung im Home Assistant-Benachrichtigungsbereich (Glocken-Symbol), wenn die Pflanze Wasser braucht.
      default: true
      selector:
        boolean: {}

    persistent_enabled_ok:
      name: "📋 HA-Benachrichtigung – Entwarnung aktiv"
      description: Ersetzt die Trocken-Benachrichtigung im HA-Benachrichtigungsbereich durch eine Entwarnung, wenn die Feuchte wieder OK ist.
      default: true
      selector:
        boolean: {}

    persistent_quiet_enabled:
      name: "🌙 HA-Benachrichtigung – Ruhezeit aktiv"
      description: >
        Wenn aktiviert, wird in der eingestellten Ruhezeit keine dauerhafte Benachrichtigung im HA-Panel erstellt.
        Ein Alarm, der in die Ruhezeit fällt, wird zum Ruhezeit-Ende nachgeholt.
      default: true
      selector:
        boolean: {}

    persistent_quiet_start:
      name: "🌙 HA-Benachrichtigung – Ruhezeit Beginn"
      description: Ab dieser Uhrzeit wird keine dauerhafte Benachrichtigung im HA-Panel erstellt. Wird die Endzeit vor der Startzeit gewählt, gilt die Ruhezeit über Mitternacht.
      default: "22:00:00"
      selector:
        time: {}

    persistent_quiet_end:
      name: "🌙 HA-Benachrichtigung – Ruhezeit Ende"
      description: Wird die Endzeit vor der Startzeit gewählt, gilt die Ruhezeit über Mitternacht hinweg. Zu dieser Uhrzeit werden zurückgehaltene Alarme nachgeholt.
      default: "07:00:00"
      selector:
        time: {}

    # ─── 🚨 SENSORAUSFALL

    sensor_failure_enabled:
      name: "🚨 Sensorausfall-Erkennung aktiv?"
      description: >
        Wenn aktiviert, wird eine Benachrichtigung gesendet, falls der Sensor für
        längere Zeit keinen gültigen Wert liefert (Status: unavailable oder unknown).
      default: false
      selector:
        boolean: {}

    sensor_failure_hours:
      name: "🚨 Toleranzzeit bei Sensorausfall (Stunden)"
      description: >
        Nach wie vielen Stunden ohne gültigen Sensorwert soll die Ausfall-Warnung gesendet werden?
        Hinweis: Nach dem Ändern dieses Werts die Automation einmal neu laden, damit der
        Trigger die neue Zeit übernimmt.
      default: 2
      selector:
        number:
          min: 1.0
          max: 24.0
          step: 1.0
          unit_of_measurement: h
          mode: slider

    sensor_failure_message:
      name: "🚨 Nachricht bei Sensorausfall"
      description: Dieser Text wird gesendet, wenn der Sensor ausgefallen ist. Der Pflanzenname wird automatisch vorangestellt.
      default: "Sensor antwortet nicht – bitte prüfen!"
      selector:
        text:
          multiline: false
          multiple: false

    # ─── 🏖️ URLAUBS-/PAUSE-MODUS

    pause_mode_enabled:
      name: "🏖️ Urlaubs-/Pause-Modus aktivieren?"
      description: >
        Wenn aktiviert, werden alle Benachrichtigungen (Alexa, Mobile App, HA) unterdrückt –
        Trocken-Alarm und Entwarnung.
        Das automatische und planmäßige Gießen läuft aber weiter – die Pflanze wird auch im Urlaub versorgt.
        Erstelle vorher einen input_boolean in deinen Helfern (z. B. input_boolean.urlaubsmodus).
      default: false
      selector:
        boolean: {}

    pause_mode_entity:
      name: "🏖️ Pause-Schalter (input_boolean)"
      description: >
        Wähle den input_boolean aus, der als Pause-Schalter dienen soll.
        Wenn dieser Schalter „Ein" ist: Alle Benachrichtigungen werden unterdrückt, das Gießen läuft aber weiter.
        Leer lassen wenn kein Pause-Modus verwendet wird.
      default: null
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false

  source_url: https://github.com/x1marc/ha-blueprints/blob/main/Bodenfeuchte.yaml

# mode: parallel ist Absicht.
# Bei mode: restart bricht JEDER der Trigger einen bereits laufenden Ablauf ab –
# z. B. das planmäßige Gießen um 07:00 die Alexa-Wiederholschleife, oder ein
# Sensorausfall den Pumpen-Ablauf zwischen Ein- und Ausschalten (Pumpe bleibt an).
# Die einzelnen Zweige sind gegeneinander abgesichert:
#   - der Pumpen-Zweig startet nur, wenn die Pumpe gerade aus ist
#   - die Not-Abschaltung läuft als eigener Trigger und greift immer
#   - Doppel-Alarme verhindert die Sperrzeit
mode: parallel
max: 10
max_exceeded: silent

# ─────────────────────────────────────────────────────────────────────────────
# WICHTIG: Alles in diesem Block wird von HA GENAU EINMAL beim Auslösen
# berechnet und ändert sich während des Ablaufs nicht mehr.
# Deshalb stehen hier nur statische Werte. Alles, was von Uhrzeit oder
# Entity-Zuständen abhängt (Ruhezeit, Pause-Modus, Anwesenheit, Messwert),
# wird im Ablauf per "- variables:" frisch berechnet.
# ─────────────────────────────────────────────────────────────────────────────
variables:
  sensor: !input moisture_sensor
  plant_name: !input plant_name
  thr: !input threshold_low
  hyst: !input hysteresis
  thr_ok: "{{ ((thr | float(0)) + (hyst | float(0))) | round(1) }}"

  repeat_mode: !input repeat_mode
  repeat_interval: !input repeat_interval
  snooze_duration: !input snooze_duration
  cooldown_minutes: !input cooldown_minutes
  cooldown_helper: !input cooldown_helper

  pause_mode_enabled: !input pause_mode_enabled
  pause_mode_entity: !input pause_mode_entity

  auto_water_enabled: !input auto_water_enabled
  auto_water_switch: !input auto_water_switch
  auto_water_duration: !input auto_water_duration
  auto_water_check_enabled: !input auto_water_check_enabled
  auto_water_check_delay: !input auto_water_check_delay
  auto_water_on_failure: !input auto_water_on_failure
  auto_water_failure_title: !input auto_water_failure_title
  auto_water_failure_message: !input auto_water_failure_message

  scheduled_water_enabled: !input scheduled_water_enabled
  scheduled_water_duration: !input scheduled_water_duration
  scheduled_water_use_sensor: !input scheduled_water_use_sensor
  scheduled_water_threshold: !input scheduled_water_threshold

  weekday_filter_enabled: !input weekday_filter_enabled
  weekday_filter: !input weekday_filter

  sensor_failure_enabled: !input sensor_failure_enabled
  sensor_failure_message: !input sensor_failure_message

  title_dry: !input title_dry
  message_prefix_dry: !input message_prefix_dry
  ok_info_enabled: !input ok_info_enabled
  title_ok: !input title_ok
  message_prefix_ok: !input message_prefix_ok

  alexa_intro: !input alexa_intro
  alexa_message_dry: !input alexa_message_dry
  alexa_message_ok: !input alexa_message_ok
  alexa_enabled_dry: !input alexa_enabled_dry
  alexa_enabled_ok: !input alexa_enabled_ok
  alexa_targets: !input alexa_targets
  alexa_volume_temp_enabled: !input alexa_volume_temp_enabled
  alexa_volume_level: !input alexa_volume_level
  alexa_volume_restore_delay: !input alexa_volume_restore_delay
  alexa_quiet_enabled: !input alexa_quiet_enabled
  alexa_quiet_start: !input alexa_quiet_start
  alexa_quiet_end: !input alexa_quiet_end

  persistent_enabled_dry: !input persistent_enabled_dry
  persistent_enabled_ok: !input persistent_enabled_ok
  persistent_quiet_enabled: !input persistent_quiet_enabled
  persistent_quiet_start: !input persistent_quiet_start
  persistent_quiet_end: !input persistent_quiet_end

  mobile_enabled_dry: !input mobile_enabled_dry
  mobile_enabled_ok: !input mobile_enabled_ok
  mobile_device: !input mobile_device
  mobile_quiet_enabled: !input mobile_quiet_enabled
  mobile_quiet_start: !input mobile_quiet_start
  mobile_quiet_end: !input mobile_quiet_end

  presence_entity: !input presence_entity
  presence_zone: !input presence_zone

  sensor_name: "{{ state_attr(sensor, 'friendly_name') or sensor }}"
  notification_id: "bodenfeuchte_{{ sensor | slugify }}"

  # Pumpe gültig ausgewählt?
  pump_valid: >-
    {{ auto_water_switch is not none
       and auto_water_switch is not sameas false
       and (auto_water_switch | string) not in ['', 'None'] }}

  # Sperrzeit-Speicher gültig ausgewählt?
  cooldown_helper_valid: >-
    {{ cooldown_helper is not none
       and cooldown_helper is not sameas false
       and (cooldown_helper | string) not in ['', 'None'] }}

  # Mobile-App: Geräte -> notify-Dienste
  mobile_notify_services: >-
    {% if mobile_device is none or mobile_device is sameas false or (mobile_device | string) == "None" %}
      {{ [] }}
    {% else %}
      {% set devices = mobile_device if (mobile_device is iterable and mobile_device is not string) else [mobile_device] %}
      {% set ns = namespace(services=[]) %}
      {% for dev in devices %}
        {% set dev_name = device_attr(dev, 'name') %}
        {% if dev_name %}
          {% set ns.services = ns.services + ['notify.mobile_app_' + (dev_name | slugify)] %}
        {% endif %}
      {% endfor %}
      {{ ns.services }}
    {% endif %}

  # Alexa-Targets: none/false abfangen -> leere Liste
  alexa_targets_safe: >-
    {% if alexa_targets is none or alexa_targets is sameas false or (alexa_targets | string) == "None" %}
      {{ [] }}
    {% elif alexa_targets is string %}
      {{ [alexa_targets] }}
    {% else %}
      {{ alexa_targets }}
    {% endif %}

# Trigger-Templates sehen AUSSCHLIESSLICH diese Variablen – nicht den variables-Block.
trigger_variables:
  thr: !input threshold_low
  hyst: !input hysteresis
  thr_ok: "{{ ((thr | float(0)) + (hyst | float(0))) | round(1) }}"
  _sensor: !input moisture_sensor
  _notif_id: "bodenfeuchte_{{ _sensor | slugify }}"
  _snooze_action: "snooze_bodenfeuchte_{{ _sensor | slugify }}"
  _sensor_failure_hours: !input sensor_failure_hours
  _aw_safety: !input auto_water_safety_timeout
  _aw_duration: !input auto_water_duration
  _sw_duration: !input scheduled_water_duration
  # Not-Abschaltung darf das normale Gießen nie unterbrechen:
  # mindestens die längste Pumpen-Laufzeit + 30 s.
  _pump_safety: >-
    {{ [ (_aw_safety | int(90)),
         (_aw_duration | int(30)) + 30,
         (_sw_duration | int(20)) + 30 ] | max }}

trigger:
  # Feuchte unter Grenzwert
  - platform: numeric_state
    id: dry
    entity_id: !input moisture_sensor
    below: !input threshold_low
    for: !input below_for

  # Feuchte wieder über Grenzwert + Hysterese.
  # Template-Trigger, weil numeric_state bei above:/below: KEIN Template akzeptiert.
  - platform: template
    id: ok
    value_template: "{{ states(_sensor) | float(-1) >= (thr_ok | float(0)) }}"
    for: !input ok_for

  # Sensorausfall: unavailable oder unknown für X Stunden
  - platform: state
    id: sensor_failure
    entity_id: !input moisture_sensor
    to:
      - unavailable
      - unknown
    for:
      hours: "{{ _sensor_failure_hours | int(2) }}"

  # Aktions-Button „Als gegossen markieren"
  - platform: event
    id: action_watered
    event_type: mobile_app_notification_action
    event_data:
      action: "dismiss_{{ _notif_id }}"

  # Aktions-Button „Später erinnern" (Snooze)
  - platform: event
    id: action_snooze
    event_type: mobile_app_notification_action
    event_data:
      action: "{{ _snooze_action }}"

  # Planmäßiges Gießen
  - platform: time
    id: scheduled_water
    at: !input scheduled_water_time

  # Nachholung zurückgehaltener Alarme am Ruhezeit-Ende (übersteht HA-Neustart)
  - platform: time
    id: quiet_end_mobile
    at: !input mobile_quiet_end

  - platform: time
    id: quiet_end_persistent
    at: !input persistent_quiet_end

  - platform: time
    id: quiet_end_alexa
    at: !input alexa_quiet_end

  # Not-Abschaltung: Pumpe zu lange am Stück an.
  # Ist keine Pumpe gewählt, ist entity_id leer und der Trigger feuert nie.
  - platform: state
    id: pump_safety
    entity_id: !input auto_water_switch
    to: "on"
    for:
      seconds: "{{ _pump_safety | int(90) }}"

  # Nach HA-Neustart prüfen, ob die Pflanze bereits trocken ist
  # (numeric_state feuert nur beim Unterschreiten, nicht im Dauerzustand).
  - platform: homeassistant
    id: ha_start
    event: start

condition: []

action:
  - choose:

    # ─── PUMPEN-NOT-ABSCHALTUNG ─────────────────────────────────────────────────
    # Zuerst geprüft. Greift unabhängig davon, was die Automation gerade macht –
    # auch wenn ein Ablauf abgebrochen wurde oder die Pumpe von Hand lief.
    - conditions:
        - condition: trigger
          id: pump_safety
        - condition: template
          value_template: "{{ pump_valid | bool }}"
      sequence:
        - service: homeassistant.turn_off
          target:
            entity_id: "{{ auto_water_switch }}"
        - service: persistent_notification.create
          data:
            title: "🛑 Pumpe not-abgeschaltet"
            message: >-
              Die Bewässerung von {{ plant_name }} lief länger als das eingestellte
              Sicherheits-Timeout und wurde zwangsweise abgeschaltet.
              (Sensor: {{ sensor_name }} = {{ states(sensor) }} %)
            notification_id: "{{ notification_id }}_safety"

    # ─── TROCKEN-ALARM ──────────────────────────────────────────────────────────
    - conditions:
        - condition: trigger
          id:
            - dry
            - ha_start
      sequence:

        # Nach HA-Neustart kurz warten, bis Integrationen geladen sind
        - choose:
          - conditions:
              - condition: trigger
                id: ha_start
            sequence:
              - delay:
                  minutes: 2

        - variables:
            live_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            live_cooldown_ok: >-
              {% if (cooldown_minutes | int(0)) == 0 %}
                true
              {% else %}
                {% set ref = states(cooldown_helper) if (cooldown_helper_valid | bool)
                             else (this.attributes.last_triggered if this else none) %}
                {{ (now().timestamp() - (ref | as_timestamp(0))) > ((cooldown_minutes | int(0)) * 60) }}
              {% endif %}

        # Nichts zu tun, wenn die Pflanze gar nicht (mehr) trocken ist
        - condition: template
          value_template: "{{ live_is_dry | bool }}"

        # ── Automatisches Gießen (läuft auch im Pause-Modus und an gesperrten Tagen)
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ auto_water_enabled | bool
                     and pump_valid | bool
                     and not is_state(auto_water_switch, 'on') }}
            sequence:
              # ── Pump-Durchgang 1 ──
              - service: homeassistant.turn_on
                target:
                  entity_id: "{{ auto_water_switch }}"
              - wait_for_trigger:
                  - platform: template
                    value_template: "{{ states(sensor) | float(0) >= (thr_ok | float(0)) }}"
                timeout:
                  seconds: "{{ auto_water_duration | int(30) }}"
                continue_on_timeout: true
              - service: homeassistant.turn_off
                target:
                  entity_id: "{{ auto_water_switch }}"

              # ── Bewässerungs-Kontrolle ──
              - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ auto_water_check_enabled | bool }}"
                  sequence:
                    # Wasser einsickern lassen
                    - delay:
                        seconds: "{{ auto_water_check_delay | int(60) }}"

                    # Noch trocken und „Erneut gießen" gewählt? → 2. Durchgang
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ (states(sensor) | float(999)) < (thr | float(0))
                                 and auto_water_on_failure == 'retry'
                                 and not is_state(auto_water_switch, 'on') }}
                        sequence:
                          - service: homeassistant.turn_on
                            target:
                              entity_id: "{{ auto_water_switch }}"
                          - wait_for_trigger:
                              - platform: template
                                value_template: "{{ states(sensor) | float(0) >= (thr_ok | float(0)) }}"
                            timeout:
                              seconds: "{{ auto_water_duration | int(30) }}"
                            continue_on_timeout: true
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ auto_water_switch }}"
                          - delay:
                              seconds: "{{ auto_water_check_delay | int(60) }}"

                    # Immer noch trocken → Fehler-Alarm
                    # Hinweis: ignoriert bewusst Ruhezeit, Pause-Modus und Wochentag-Filter.
                    # Eine defekte Pumpe oder ein leerer Tank soll immer gemeldet werden.
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
                        sequence:
                          - service: persistent_notification.create
                            data:
                              title: "{{ auto_water_failure_title }}"
                              message: >-
                                {{ auto_water_failure_message }}
                                (Sensor: {{ sensor_name }} = {{ states(sensor) }} %,
                                Grenzwert: {{ thr }} %)
                              notification_id: "{{ notification_id }}_pump_failure"
                          - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ mobile_enabled_dry | bool and (mobile_notify_services | count > 0) }}
                              sequence:
                                - repeat:
                                    for_each: "{{ mobile_notify_services }}"
                                    sequence:
                                      - service: "{{ repeat.item }}"
                                        continue_on_error: true
                                        data:
                                          title: "{{ auto_water_failure_title }}"
                                          message: >-
                                            {{ auto_water_failure_message }}
                                            ({{ sensor_name }}: {{ states(sensor) }} %)
                                          data:
                                            tag: "{{ notification_id }}_pump_failure"
                          - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ alexa_enabled_dry | bool and (alexa_targets_safe | count > 0) }}
                              sequence:
                                - repeat:
                                    for_each: "{{ alexa_targets_safe }}"
                                    sequence:
                                      - service: notify.alexa_media
                                        continue_on_error: true
                                        data:
                                          message: >-
                                            {{ alexa_intro + ' ' if alexa_intro else '' }}{{ plant_name }}:
                                            {{ auto_water_failure_message }}
                                          target:
                                            - "{{ repeat.item }}"

        # ── Ab hier Benachrichtigungen: alle Live-Werte frisch einlesen ──────────
        - variables:
            n_moisture: "{{ states(sensor) }}"
            n_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            n_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            n_weekday: >-
              {% if not (weekday_filter_enabled | bool) %}
                true
              {% else %}
                {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] in weekday_filter }}
              {% endif %}
            n_quiet_mobile: >-
              {% if not (mobile_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(mobile_quiet_start) %}
                {% set e = today_at(mobile_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}
            n_quiet_persistent: >-
              {% if not (persistent_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(persistent_quiet_start) %}
                {% set e = today_at(persistent_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}
            n_msg_dry: >-
              {{ plant_name }} {{ message_prefix_dry }}
              (Feuchte: {{ n_moisture }} %, Grenzwert: {{ thr }} %, OK ab: {{ thr_ok }} %)

        # Abbruch, wenn erledigt oder gesperrt:
        #  - Pumpe hat die Pflanze versorgt (Sensor nicht mehr trocken)
        #  - Bewässerungs-Kontrolle aktiv → hat bereits ihren eigenen Alarm gesendet
        #  - Sperrzeit läuft noch / Wochentag nicht freigegeben
        - condition: template
          value_template: >-
            {{ (n_is_dry | bool)
               and not (auto_water_check_enabled | bool and auto_water_enabled | bool and pump_valid | bool)
               and (live_cooldown_ok | bool)
               and (n_weekday | bool) }}

        # Zeitpunkt für die Sperrzeit festhalten
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ cooldown_helper_valid | bool }}"
            sequence:
              - service: input_datetime.set_datetime
                continue_on_error: true
                target:
                  entity_id: "{{ cooldown_helper }}"
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        # ── Mobile App (einmalig; Ruhezeit → Nachholung per quiet_end_mobile) ──
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ mobile_enabled_dry | bool
                     and (mobile_notify_services | count > 0)
                     and not (n_quiet_mobile | bool)
                     and not (n_paused | bool) }}
            sequence:
              - repeat:
                  for_each: "{{ mobile_notify_services }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ title_dry }}"
                        message: "{{ n_msg_dry }}"
                        data:
                          actions:
                            - action: "dismiss_{{ notification_id }}"
                              title: "💧 Als gegossen markieren"
                            - action: "snooze_{{ notification_id }}"
                              title: "😴 Später erinnern"
                          tag: "{{ notification_id }}"

        # ── HA-Benachrichtigung (Ruhezeit → Nachholung per quiet_end_persistent) ──
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ persistent_enabled_dry | bool
                     and not (n_quiet_persistent | bool)
                     and not (n_paused | bool) }}
            sequence:
              - service: persistent_notification.create
                data:
                  title: "{{ title_dry }}"
                  message: "{{ n_msg_dry }}"
                  notification_id: "{{ notification_id }}"

        # ── Alexa: einmalig oder wiederholt ───────────────────────────────────
        # Eine einzige Schleife für beide Modi. Alle Bedingungen werden pro
        # Durchlauf NEU berechnet – dadurch wirken Ruhezeit-Ende, Pause-Modus
        # und Anwesenheit auch mitten im Ablauf.
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ alexa_enabled_dry | bool and (alexa_targets_safe | count > 0) }}
            sequence:
              - repeat:
                  sequence:
                    - variables:
                        a_moisture: "{{ states(sensor) }}"
                        a_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
                        a_paused: >-
                          {% if pause_mode_enabled | bool
                                and pause_mode_entity is not none
                                and (pause_mode_entity | string) not in ['', 'None'] %}
                            {{ is_state(pause_mode_entity, 'on') }}
                          {% else %}
                            false
                          {% endif %}
                        a_weekday: >-
                          {% if not (weekday_filter_enabled | bool) %}
                            true
                          {% else %}
                            {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] in weekday_filter }}
                          {% endif %}
                        a_quiet: >-
                          {% if not (alexa_quiet_enabled | bool) %}
                            false
                          {% else %}
                            {% set s = today_at(alexa_quiet_start) %}
                            {% set e = today_at(alexa_quiet_end) %}
                            {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
                          {% endif %}
                        a_present: >-
                          {% set ps = presence_entity if (presence_entity is iterable and presence_entity is not string)
                                      else ([presence_entity] if presence_entity else []) %}
                          {% if (ps | count) == 0 %}
                            true
                          {% else %}
                            {% set zr = presence_zone if (presence_zone is iterable and presence_zone is not string)
                                        else ([presence_zone] if presence_zone else []) %}
                            {% set zs = zr if (zr | count) > 0 else ['zone.home'] %}
                            {% set ns = namespace(found=false) %}
                            {% for p in ps %}
                              {% set pstate = states(p) %}
                              {% for z in zs %}
                                {% if pstate == z.split('.')[-1]
                                      or pstate == (state_attr(z, 'friendly_name') | default('##none##', true)) %}
                                  {% set ns.found = true %}
                                {% endif %}
                              {% endfor %}
                            {% endfor %}
                            {{ ns.found }}
                          {% endif %}
                        a_msg: >-
                          {{ alexa_intro + ' ' if alexa_intro else '' }}{{ plant_name }} {{ alexa_message_dry }}
                          Aktuell {{ a_moisture }} Prozent.

                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ (a_is_dry | bool)
                                 and not (a_quiet | bool)
                                 and not (a_paused | bool)
                                 and (a_present | bool)
                                 and (a_weekday | bool) }}
                        sequence:
                          - repeat:
                              for_each: "{{ alexa_targets_safe }}"
                              sequence:
                                - variables:
                                    _player: "{{ repeat.item }}"
                                    _prev_vol: "{{ state_attr(repeat.item, 'volume_level') | float(0.3) }}"
                                - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ alexa_volume_temp_enabled | bool }}"
                                    sequence:
                                      - service: media_player.volume_set
                                        continue_on_error: true
                                        target:
                                          entity_id: "{{ _player }}"
                                        data:
                                          volume_level: "{{ alexa_volume_level | float(0.35) }}"
                                - service: notify.alexa_media
                                  continue_on_error: true
                                  data:
                                    title: "{{ title_dry }}"
                                    message: "{{ a_msg }}"
                                    target:
                                      - "{{ _player }}"
                                - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ alexa_volume_temp_enabled | bool }}"
                                    sequence:
                                      - delay:
                                          seconds: "{{ alexa_volume_restore_delay | int(10) }}"
                                      - service: media_player.volume_set
                                        continue_on_error: true
                                        target:
                                          entity_id: "{{ _player }}"
                                        data:
                                          volume_level: "{{ _prev_vol }}"

                    # Warten bis zur nächsten Wiederholung – vorzeitig geweckt durch:
                    # Feuchte OK · Button-Druck · Ruhezeit-Ende
                    - wait_for_trigger:
                        - platform: template
                          id: sensor_ok
                          value_template: "{{ states(sensor) | float(0) >= (thr_ok | float(0)) }}"
                        - platform: event
                          id: user_action
                          event_type: mobile_app_notification_action
                          event_data:
                            action: "dismiss_{{ notification_id }}"
                        - platform: event
                          id: user_action
                          event_type: mobile_app_notification_action
                          event_data:
                            action: "snooze_{{ notification_id }}"
                        - platform: time
                          id: quiet_over
                          at: "{{ alexa_quiet_end }}"
                      timeout:
                        seconds: >-
                          {{ 1 if repeat_mode != 'repeat' else (repeat_interval | int(30)) * 60 }}
                      continue_on_timeout: true

                    # Button gedrückt → Ansagen für die Snooze-Dauer pausieren
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ wait.trigger is not none and wait.trigger.id | default('') == 'user_action' }}
                        sequence:
                          - wait_for_trigger:
                              - platform: template
                                value_template: "{{ states(sensor) | float(0) >= (thr_ok | float(0)) }}"
                            timeout:
                              minutes: "{{ snooze_duration | int(120) }}"
                            continue_on_timeout: true
                  until:
                    - condition: template
                      value_template: >-
                        {{ repeat_mode != 'repeat'
                           or (states(sensor) | float(999)) >= (thr | float(0))
                           or (repeat.index | int(0)) >= 500 }}

    # ─── ENTWARNUNG (OK) ────────────────────────────────────────────────────────
    - conditions:
        - condition: trigger
          id: ok
        - condition: template
          value_template: "{{ ok_info_enabled | bool }}"
      sequence:
        - variables:
            o_is_ok: "{{ (states(sensor) | float(-1)) >= (thr_ok | float(0)) }}"
            o_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            o_present: >-
              {% set ps = presence_entity if (presence_entity is iterable and presence_entity is not string)
                          else ([presence_entity] if presence_entity else []) %}
              {% if (ps | count) == 0 %}
                true
              {% else %}
                {% set zr = presence_zone if (presence_zone is iterable and presence_zone is not string)
                            else ([presence_zone] if presence_zone else []) %}
                {% set zs = zr if (zr | count) > 0 else ['zone.home'] %}
                {% set ns = namespace(found=false) %}
                {% for p in ps %}
                  {% set pstate = states(p) %}
                  {% for z in zs %}
                    {% if pstate == z.split('.')[-1]
                          or pstate == (state_attr(z, 'friendly_name') | default('##none##', true)) %}
                      {% set ns.found = true %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.found }}
              {% endif %}
            o_quiet_alexa: >-
              {% if not (alexa_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(alexa_quiet_start) %}
                {% set e = today_at(alexa_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}
            o_quiet_mobile: >-
              {% if not (mobile_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(mobile_quiet_start) %}
                {% set e = today_at(mobile_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}
            o_quiet_persistent: >-
              {% if not (persistent_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(persistent_quiet_start) %}
                {% set e = today_at(persistent_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}

        - condition: template
          value_template: "{{ o_is_ok | bool }}"

        # Trocken-Benachrichtigung immer entfernen – auch im Pause-Modus
        - service: persistent_notification.dismiss
          data:
            notification_id: "{{ notification_id }}"

        # Entwarnung nur senden, wenn nicht pausiert
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ not (o_paused | bool) }}"
            sequence:

              # ── Alexa ──
              - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ alexa_enabled_ok | bool
                           and (alexa_targets_safe | count > 0)
                           and (o_present | bool) }}
                  sequence:
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ o_quiet_alexa | bool }}"
                        sequence:
                          - wait_for_trigger:
                              - platform: time
                                at: "{{ alexa_quiet_end }}"
                            timeout:
                              hours: 24
                            continue_on_timeout: true
                    - variables:
                        oa_quiet: >-
                          {% if not (alexa_quiet_enabled | bool) %}
                            false
                          {% else %}
                            {% set s = today_at(alexa_quiet_start) %}
                            {% set e = today_at(alexa_quiet_end) %}
                            {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
                          {% endif %}
                        oa_msg: >-
                          {{ alexa_intro + ' ' if alexa_intro else '' }}{{ plant_name }}: {{ alexa_message_ok }}
                          Aktuell {{ states(sensor) }} Prozent.
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ not (oa_quiet | bool)
                                 and (states(sensor) | float(-1)) >= (thr_ok | float(0)) }}
                        sequence:
                          - repeat:
                              for_each: "{{ alexa_targets_safe }}"
                              sequence:
                                - variables:
                                    _player: "{{ repeat.item }}"
                                    _prev_vol: "{{ state_attr(repeat.item, 'volume_level') | float(0.3) }}"
                                - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ alexa_volume_temp_enabled | bool }}"
                                    sequence:
                                      - service: media_player.volume_set
                                        continue_on_error: true
                                        target:
                                          entity_id: "{{ _player }}"
                                        data:
                                          volume_level: "{{ alexa_volume_level | float(0.35) }}"
                                - service: notify.alexa_media
                                  continue_on_error: true
                                  data:
                                    title: "{{ title_ok }}"
                                    message: "{{ oa_msg }}"
                                    target:
                                      - "{{ _player }}"
                                - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ alexa_volume_temp_enabled | bool }}"
                                    sequence:
                                      - delay:
                                          seconds: "{{ alexa_volume_restore_delay | int(10) }}"
                                      - service: media_player.volume_set
                                        continue_on_error: true
                                        target:
                                          entity_id: "{{ _player }}"
                                        data:
                                          volume_level: "{{ _prev_vol }}"

              # ── Mobile App ──
              - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ mobile_enabled_ok | bool and (mobile_notify_services | count > 0) }}
                  sequence:
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ o_quiet_mobile | bool }}"
                        sequence:
                          - wait_for_trigger:
                              - platform: time
                                at: "{{ mobile_quiet_end }}"
                            timeout:
                              hours: 24
                            continue_on_timeout: true
                    - variables:
                        om_quiet: >-
                          {% if not (mobile_quiet_enabled | bool) %}
                            false
                          {% else %}
                            {% set s = today_at(mobile_quiet_start) %}
                            {% set e = today_at(mobile_quiet_end) %}
                            {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
                          {% endif %}
                        om_msg: >-
                          {{ plant_name }} {{ message_prefix_ok }}
                          (Feuchte: {{ states(sensor) }} %, OK ab: {{ thr_ok }} %)
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ not (om_quiet | bool)
                                 and (states(sensor) | float(-1)) >= (thr_ok | float(0)) }}
                        sequence:
                          - repeat:
                              for_each: "{{ mobile_notify_services }}"
                              sequence:
                                - service: "{{ repeat.item }}"
                                  continue_on_error: true
                                  data:
                                    title: "{{ title_ok }}"
                                    message: "{{ om_msg }}"
                                    data:
                                      tag: "{{ notification_id }}"

              # ── HA-Benachrichtigung ──
              - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ persistent_enabled_ok | bool }}"
                  sequence:
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ o_quiet_persistent | bool }}"
                        sequence:
                          - wait_for_trigger:
                              - platform: time
                                at: "{{ persistent_quiet_end }}"
                            timeout:
                              hours: 24
                            continue_on_timeout: true
                    - variables:
                        op_quiet: >-
                          {% if not (persistent_quiet_enabled | bool) %}
                            false
                          {% else %}
                            {% set s = today_at(persistent_quiet_start) %}
                            {% set e = today_at(persistent_quiet_end) %}
                            {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
                          {% endif %}
                        op_msg: >-
                          {{ plant_name }} {{ message_prefix_ok }}
                          (Feuchte: {{ states(sensor) }} %, OK ab: {{ thr_ok }} %)
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ not (op_quiet | bool)
                                 and (states(sensor) | float(-1)) >= (thr_ok | float(0)) }}
                        sequence:
                          - service: persistent_notification.create
                            data:
                              title: "{{ title_ok }}"
                              message: "{{ op_msg }}"
                              notification_id: "{{ notification_id }}"

    # ─── SENSORAUSFALL ──────────────────────────────────────────────────────────
    # Kritischer Alarm: ignoriert bewusst Ruhezeiten und Wochentag-Filter.
    - conditions:
        - condition: trigger
          id: sensor_failure
        - condition: template
          value_template: "{{ sensor_failure_enabled | bool }}"
      sequence:
        - variables:
            f_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            f_msg: "{{ plant_name }}: {{ sensor_failure_message }} (Sensor: {{ sensor_name }})"
        - condition: template
          value_template: "{{ not (f_paused | bool) }}"
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ persistent_enabled_dry | bool }}"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "🚨 Sensor-Ausfall"
                  message: "{{ f_msg }}"
                  notification_id: "{{ notification_id }}_failure"
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ mobile_enabled_dry | bool and (mobile_notify_services | count > 0) }}
            sequence:
              - repeat:
                  for_each: "{{ mobile_notify_services }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "🚨 Sensor-Ausfall"
                        message: "{{ f_msg }}"
                        data:
                          tag: "{{ notification_id }}_failure"
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ alexa_enabled_dry | bool and (alexa_targets_safe | count > 0) }}
            sequence:
              - repeat:
                  for_each: "{{ alexa_targets_safe }}"
                  sequence:
                    - service: notify.alexa_media
                      continue_on_error: true
                      data:
                        title: "Sensor-Ausfall"
                        message: "{{ f_msg }}"
                        target:
                          - "{{ repeat.item }}"

    # ─── AKTIONS-BUTTON „Als gegossen markieren" ────────────────────────────────
    - conditions:
        - condition: trigger
          id: action_watered
      sequence:
        - service: persistent_notification.dismiss
          data:
            notification_id: "{{ notification_id }}"
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ mobile_notify_services | count > 0 }}"
            sequence:
              - repeat:
                  for_each: "{{ mobile_notify_services }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        message: "clear_notification"
                        data:
                          tag: "{{ notification_id }}"

    # ─── AKTIONS-BUTTON „Später erinnern" (Snooze) ──────────────────────────────
    - conditions:
        - condition: trigger
          id: action_snooze
      sequence:
        # Benachrichtigung sofort schließen
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ mobile_notify_services | count > 0 }}"
            sequence:
              - repeat:
                  for_each: "{{ mobile_notify_services }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        message: "clear_notification"
                        data:
                          tag: "{{ notification_id }}"

        # Snooze-Zeit warten – oder früher aufwachen, wenn gegossen wurde
        - wait_for_trigger:
            - platform: template
              value_template: "{{ states(sensor) | float(0) >= (thr_ok | float(0)) }}"
          timeout:
            minutes: "{{ snooze_duration | int(120) }}"
          continue_on_timeout: true

        # Live-Werte nach dem Warten neu einlesen
        - variables:
            s_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            s_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            s_quiet_mobile: >-
              {% if not (mobile_quiet_enabled | bool) %}
                false
              {% else %}
                {% set s = today_at(mobile_quiet_start) %}
                {% set e = today_at(mobile_quiet_end) %}
                {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
              {% endif %}
            s_msg: >-
              {{ plant_name }} {{ message_prefix_dry }}
              (Feuchte: {{ states(sensor) }} %, Grenzwert: {{ thr }} %, OK ab: {{ thr_ok }} %)

        - condition: template
          value_template: >-
            {{ (s_is_dry | bool)
               and not (s_paused | bool)
               and not (s_quiet_mobile | bool)
               and (mobile_enabled_dry | bool)
               and (mobile_notify_services | count > 0) }}

        - repeat:
            for_each: "{{ mobile_notify_services }}"
            sequence:
              - service: "{{ repeat.item }}"
                continue_on_error: true
                data:
                  title: "{{ title_dry }}"
                  message: "{{ s_msg }}"
                  data:
                    actions:
                      - action: "dismiss_{{ notification_id }}"
                        title: "💧 Als gegossen markieren"
                      - action: "snooze_{{ notification_id }}"
                        title: "😴 Später erinnern"
                    tag: "{{ notification_id }}"

    # ─── PLANMÄSSIGES GIESSEN ───────────────────────────────────────────────────
    - conditions:
        - condition: trigger
          id: scheduled_water
        - condition: template
          value_template: "{{ scheduled_water_enabled | bool and pump_valid | bool }}"
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ (not (scheduled_water_use_sensor | bool)
                      or (states(sensor) | float(0)) < (scheduled_water_threshold | float(60)))
                     and not is_state(auto_water_switch, 'on') }}
            sequence:
              - service: homeassistant.turn_on
                target:
                  entity_id: "{{ auto_water_switch }}"
              # Stoppt vorzeitig beim ZEITPLAN-Schwellenwert (nicht beim Alarm-OK-Wert).
              # Ohne Sensor-Check ist das Template konstant false → volle Laufzeit.
              - wait_for_trigger:
                  - platform: template
                    value_template: >-
                      {{ (scheduled_water_use_sensor | bool)
                         and (states(sensor) | float(0)) >= (scheduled_water_threshold | float(60)) }}
                timeout:
                  seconds: "{{ scheduled_water_duration | int(20) }}"
                continue_on_timeout: true
              - service: homeassistant.turn_off
                target:
                  entity_id: "{{ auto_water_switch }}"

              # Optionale Alexa-Bestätigung
              - variables:
                  w_paused: >-
                    {% if pause_mode_enabled | bool
                          and pause_mode_entity is not none
                          and (pause_mode_entity | string) not in ['', 'None'] %}
                      {{ is_state(pause_mode_entity, 'on') }}
                    {% else %}
                      false
                    {% endif %}
                  w_quiet: >-
                    {% if not (alexa_quiet_enabled | bool) %}
                      false
                    {% else %}
                      {% set s = today_at(alexa_quiet_start) %}
                      {% set e = today_at(alexa_quiet_end) %}
                      {% if e <= s %}{{ now() >= s or now() < e }}{% else %}{{ now() >= s and now() < e }}{% endif %}
                    {% endif %}
                  w_present: >-
                    {% set ps = presence_entity if (presence_entity is iterable and presence_entity is not string)
                                else ([presence_entity] if presence_entity else []) %}
                    {% if (ps | count) == 0 %}
                      true
                    {% else %}
                      {% set zr = presence_zone if (presence_zone is iterable and presence_zone is not string)
                                  else ([presence_zone] if presence_zone else []) %}
                      {% set zs = zr if (zr | count) > 0 else ['zone.home'] %}
                      {% set ns = namespace(found=false) %}
                      {% for p in ps %}
                        {% set pstate = states(p) %}
                        {% for z in zs %}
                          {% if pstate == z.split('.')[-1]
                                or pstate == (state_attr(z, 'friendly_name') | default('##none##', true)) %}
                            {% set ns.found = true %}
                          {% endif %}
                        {% endfor %}
                      {% endfor %}
                      {{ ns.found }}
                    {% endif %}
              - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ alexa_enabled_dry | bool
                           and (alexa_targets_safe | count > 0)
                           and not (w_quiet | bool)
                           and not (w_paused | bool)
                           and (w_present | bool) }}
                  sequence:
                    - repeat:
                        for_each: "{{ alexa_targets_safe }}"
                        sequence:
                          - service: notify.alexa_media
                            continue_on_error: true
                            data:
                              message: >-
                                {{ alexa_intro + ' ' if alexa_intro else '' }}{{ plant_name }}
                                wurde planmäßig bewässert.
                                Aktuell {{ states(sensor) }} Prozent Feuchte.
                              target:
                                - "{{ repeat.item }}"

    # ─── NACHHOLUNG AM RUHEZEIT-ENDE – Mobile App ───────────────────────────────
    # Ersetzt den früheren Warteblock im Ablauf: läuft als eigener Trigger und
    # übersteht daher auch einen HA-Neustart.
    - conditions:
        - condition: trigger
          id: quiet_end_mobile
        - condition: template
          value_template: >-
            {{ mobile_quiet_enabled | bool
               and mobile_enabled_dry | bool
               and (mobile_notify_services | count > 0) }}
      sequence:
        - variables:
            q_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            q_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            q_weekday: >-
              {% if not (weekday_filter_enabled | bool) %}
                true
              {% else %}
                {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] in weekday_filter }}
              {% endif %}
            q_msg: >-
              {{ plant_name }} {{ message_prefix_dry }}
              (Feuchte: {{ states(sensor) }} %, Grenzwert: {{ thr }} %, OK ab: {{ thr_ok }} %)
        - condition: template
          value_template: >-
            {{ (q_is_dry | bool) and not (q_paused | bool) and (q_weekday | bool) }}
        - repeat:
            for_each: "{{ mobile_notify_services }}"
            sequence:
              - service: "{{ repeat.item }}"
                continue_on_error: true
                data:
                  title: "{{ title_dry }}"
                  message: "{{ q_msg }}"
                  data:
                    actions:
                      - action: "dismiss_{{ notification_id }}"
                        title: "💧 Als gegossen markieren"
                      - action: "snooze_{{ notification_id }}"
                        title: "😴 Später erinnern"
                    tag: "{{ notification_id }}"

    # ─── NACHHOLUNG AM RUHEZEIT-ENDE – HA-Benachrichtigung ──────────────────────
    - conditions:
        - condition: trigger
          id: quiet_end_persistent
        - condition: template
          value_template: >-
            {{ persistent_quiet_enabled | bool and persistent_enabled_dry | bool }}
      sequence:
        - variables:
            q_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            q_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            q_weekday: >-
              {% if not (weekday_filter_enabled | bool) %}
                true
              {% else %}
                {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] in weekday_filter }}
              {% endif %}
            q_msg: >-
              {{ plant_name }} {{ message_prefix_dry }}
              (Feuchte: {{ states(sensor) }} %, Grenzwert: {{ thr }} %, OK ab: {{ thr_ok }} %)
        - condition: template
          value_template: >-
            {{ (q_is_dry | bool) and not (q_paused | bool) and (q_weekday | bool) }}
        - service: persistent_notification.create
          data:
            title: "{{ title_dry }}"
            message: "{{ q_msg }}"
            notification_id: "{{ notification_id }}"

    # ─── NACHHOLUNG AM RUHEZEIT-ENDE – Alexa ────────────────────────────────────
    # Nur im Einmal-Modus nötig: im Wiederhol-Modus wacht die Schleife selbst
    # zum Ruhezeit-Ende auf und sagt dann an.
    - conditions:
        - condition: trigger
          id: quiet_end_alexa
        - condition: template
          value_template: >-
            {{ alexa_quiet_enabled | bool
               and alexa_enabled_dry | bool
               and repeat_mode != 'repeat'
               and (alexa_targets_safe | count > 0) }}
      sequence:
        - variables:
            q_is_dry: "{{ (states(sensor) | float(999)) < (thr | float(0)) }}"
            q_paused: >-
              {% if pause_mode_enabled | bool
                    and pause_mode_entity is not none
                    and (pause_mode_entity | string) not in ['', 'None'] %}
                {{ is_state(pause_mode_entity, 'on') }}
              {% else %}
                false
              {% endif %}
            q_weekday: >-
              {% if not (weekday_filter_enabled | bool) %}
                true
              {% else %}
                {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] in weekday_filter }}
              {% endif %}
            q_present: >-
              {% set ps = presence_entity if (presence_entity is iterable and presence_entity is not string)
                          else ([presence_entity] if presence_entity else []) %}
              {% if (ps | count) == 0 %}
                true
              {% else %}
                {% set zr = presence_zone if (presence_zone is iterable and presence_zone is not string)
                            else ([presence_zone] if presence_zone else []) %}
                {% set zs = zr if (zr | count) > 0 else ['zone.home'] %}
                {% set ns = namespace(found=false) %}
                {% for p in ps %}
                  {% set pstate = states(p) %}
                  {% for z in zs %}
                    {% if pstate == z.split('.')[-1]
                          or pstate == (state_attr(z, 'friendly_name') | default('##none##', true)) %}
                      {% set ns.found = true %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.found }}
              {% endif %}
            q_msg: >-
              {{ alexa_intro + ' ' if alexa_intro else '' }}{{ plant_name }} {{ alexa_message_dry }}
              Aktuell {{ states(sensor) }} Prozent.
        - condition: template
          value_template: >-
            {{ (q_is_dry | bool)
               and not (q_paused | bool)
               and (q_weekday | bool)
               and (q_present | bool) }}
        - repeat:
            for_each: "{{ alexa_targets_safe }}"
            sequence:
              - variables:
                  _player: "{{ repeat.item }}"
                  _prev_vol: "{{ state_attr(repeat.item, 'volume_level') | float(0.3) }}"
              - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ alexa_volume_temp_enabled | bool }}"
                  sequence:
                    - service: media_player.volume_set
                      continue_on_error: true
                      target:
                        entity_id: "{{ _player }}"
                      data:
                        volume_level: "{{ alexa_volume_level | float(0.35) }}"
              - service: notify.alexa_media
                continue_on_error: true
                data:
                  title: "{{ title_dry }}"
                  message: "{{ q_msg }}"
                  target:
                    - "{{ _player }}"
              - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ alexa_volume_temp_enabled | bool }}"
                  sequence:
                    - delay:
                        seconds: "{{ alexa_volume_restore_delay | int(10) }}"
                    - service: media_player.volume_set
                      continue_on_error: true
                      target:
                        entity_id: "{{ _player }}"
                      data:
                        volume_level: "{{ _prev_vol }}"
