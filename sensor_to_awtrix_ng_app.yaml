blueprint:
  name: Sensor → AWTRIX NG App
  description: >
    Blendet den Wert eines beliebigen Sensors in einem festen Intervall (z. B.
    alle 30 Min) KURZ als App auf einer AWTRIX-NG-Uhr ein: Die Uhr springt zum
    Einblenden kurz zur App, zeigt den aktuellen Wert für die eingestellte Dauer
    und entfernt die App danach wieder. Sonst ist die App NICHT im App-Wechsel.
    Kein Automations-Schreiben nötig – importieren, Sensor wählen, Intervall
    wählen, fertig.

    Der Anzeige-Text wird zusammengebaut aus:
      [Text davor] [Sensorwert auf N Stellen gerundet] [Einheit]
    z. B. Einheit "kWh", 1 Stelle -> "12.3 kWh". Ist der Wert keine Zahl
    (z. B. "Zuhause"), wird er unverändert gezeigt.

    Diese Blueprint sendet direkt per MQTT – die HA-AWTRIX-NG-Skripte werden
    NICHT benötigt. Nur für AWTRIX NG (nicht AWTRIX 3).

    Hinweis: AWTRIX NG kann eine App nicht von sich aus "nur alle X Min" zeigen –
    darum blendet diese Blueprint sie aktiv ein und entfernt sie wieder. Beim
    Einblenden wird die gerade laufende App kurz unterbrochen.

    Voraussetzungen: aktive MQTT-Integration; eine per MQTT verbundene
    AWTRIX-NG-Uhr. Den Prefix findest du in der Weboberfläche der Uhr unter
    Settings -> MQTT (Standard "awtrixng").

    Changelog:
      v2.1 - Feld "AWTRIX-NG-Prefix" nach ganz oben verschoben (wie in den
             Skripten). Keine Verhaltensänderung.
      v2.0 - Verhalten geändert: Die App wird jetzt im Intervall KURZ eingeblendet
             (hinspringen -> zeigen -> wieder entfernen) statt dauerhaft in der
             Rotation zu bleiben. Neues, frei einstellbares Feld
             "Anzeige-Intervall (Minuten)"; das Feld "Selbst-Löschen" entfällt.
      v1.1 - Fix: Ein reiner Zahlenwert ohne Einheit/Text davor wurde durch HA's
             native Typwandlung als JSON-Zahl statt Text gesendet und ignoriert
             (nur das Icon war sichtbar). Text wird jetzt immer als String gesendet.
      v1.0 - Erstausgabe: Sensorwert als Pushed App.

  domain: automation
  source_url: https://github.com/x1marc/ha-blueprints/blob/main/sensor_to_awtrix_ng_app.yaml

  input:
    # ─── 📟 GERÄT ─────────────────────────────────────────────────
    prefix:
      name: AWTRIX-NG-Prefix
      description: MQTT-Prefix deiner Uhr (Settings -> MQTT). Standard "awtrixng".
      default: awtrixng
      selector:
        text:

    # ─── 📥 QUELLE ────────────────────────────────────────────────
    sensor:
      name: Sensor
      description: Der Sensor, dessen Wert eingeblendet werden soll.
      selector:
        entity: {}

    # ─── 🖥️ ANZEIGE ──────────────────────────────────────────────
    app_name:
      name: App-Name (auf der Uhr)
      description: >-
        Frei wählbarer, eindeutiger Name dieser App (nur Buchstaben/Zahlen/_/-),
        z. B. "pv_ertrag".
      default: sensorwert
      selector:
        text:
    text_prefix:
      name: Text davor (optional)
      description: 'Kurzes Label vor dem Wert, z. B. "PV " (mit Leerzeichen).'
      default: ""
      selector:
        text:
    unit:
      name: Einheit (optional)
      description: 'Wird an den Wert angehängt, z. B. "kWh", "°C", "%".'
      default: ""
      selector:
        text:
    decimals:
      name: Nachkommastellen
      description: Auf wie viele Stellen der Wert gerundet wird (nur bei Zahlen).
      default: 1
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    icon:
      name: Icon-Nummer (optional)
      description: >-
        Nummer eines Icons, das auf der Uhr gespeichert ist (z. B. "55972").
        Leer = kein Icon. Icons: developer.lametric.com/icons.
      default: ""
      selector:
        text:
    icon_mode:
      name: Icon-Verhalten
      description: Wie sich das Icon verhält, wenn der Text scrollt.
      default: fixed
      selector:
        select:
          options:
            - label: fest (bleibt stehen)
              value: fixed
            - label: einmal wegschieben
              value: pushOnce
            - label: mitscrollen
              value: push
    color:
      name: Textfarbe
      description: Farbe des Textes.
      default: [255, 255, 255]
      selector:
        color_rgb:

    # ─── ⚙️ VERHALTEN ─────────────────────────────────────────────
    interval_minutes:
      name: Anzeige-Intervall (Minuten)
      description: >-
        Alle wie viele Minuten die App kurz eingeblendet wird (frei einstellbar).
        Dazwischen ist sie nicht sichtbar. Standard 30.
      default: 30
      selector:
        number:
          min: 1
          max: 720
          step: 1
          unit_of_measurement: min
          mode: box
    duration:
      name: Anzeigedauer (Sekunden)
      description: Wie lange die App bei jedem Einblenden zu sehen ist.
      default: 8
      selector:
        number:
          min: 1
          max: 60
          step: 1
    show_on_start:
      name: Auch nach HA-Neustart einblenden
      description: Blendet die App einmal ein, wenn Home Assistant startet.
      default: true
      selector:
        boolean:

mode: single
max_exceeded: silent

variables:
  sensor_entity: !input sensor
  awtrix_prefix: !input prefix
  awtrix_app: !input app_name
  icon_id: !input icon
  icon_mode: !input icon_mode
  text_prefix: !input text_prefix
  unit: !input unit
  decimals: !input decimals
  text_color: !input color
  disp_duration: !input duration
  show_on_start: !input show_on_start
  interval_minutes: !input interval_minutes
  display_text: >-
    {% set s = states(sensor_entity) %}{% set num = s | float(none) %}{% set d = decimals | int(1) %}{{ text_prefix }}{{ ((num | round(d) | int) if d == 0 else (num | round(d))) if num is not none else s }}{{ (' ' ~ unit) if unit else '' }}

triggers:
  - trigger: time_pattern
    minutes: "/1"
    id: tick
  - trigger: homeassistant
    event: start
    id: ha_start

conditions:
  # Nur alle <Intervall> Minuten einblenden (Tick), bzw. beim HA-Start (falls gewünscht)
  - condition: template
    value_template: >-
      {{ (trigger.id == 'ha_start' and show_on_start)
         or (trigger.id == 'tick'
             and (now().hour * 60 + now().minute) % (interval_minutes | int(30)) == 0) }}

actions:
  # 1) App mit aktuellem Wert anlegen (Sicherheits-Lifetime, falls Schritt 3 ausfällt)
  - action: mqtt.publish
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ awtrix_prefix }}/cmd/apps/pushed/{{ awtrix_app }}"
      payload: >-
        {
          "text": {{ display_text | string | tojson }},
          {% if icon_id %}"icon": "{{ icon_id }}",
          "iconMode": "{{ icon_mode }}",
          {% endif %}"durationMs": {{ (disp_duration | int(8) + 10) * 1000 }},
          "lifetimeMs": {{ (disp_duration | int(8) + 60) * 1000 }},
          "textColor": {{ (text_color or [255,255,255]) | tojson }}
        }
  # 2) Sofort zur App springen, damit sie jetzt sichtbar ist
  - action: mqtt.publish
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ awtrix_prefix }}/cmd/apps/switch"
      payload: '{"name": "{{ awtrix_app }}", "fast": true}'
  # 3) Für die Anzeigedauer stehen lassen ...
  - delay:
      seconds: "{{ disp_duration | int(8) }}"
  # 4) ... dann App wieder entfernen (leeres Payload = löschen)
  - action: mqtt.publish
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ awtrix_prefix }}/cmd/apps/pushed/{{ awtrix_app }}"
      payload: ""
